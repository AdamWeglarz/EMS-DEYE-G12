      - platform: time
        at: "19:00:00"
      - platform: time
        at: "19:15:00"
      - platform: time
        at: "19:30:00"
      - platform: time
        at: "19:45:00"
      - platform: time
        at: "20:00:00"
      - platform: time
        at: "20:15:00"
      - platform: time
