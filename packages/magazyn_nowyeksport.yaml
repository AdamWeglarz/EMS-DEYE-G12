      - platform: time
        at: "17:00:00"
      - platform: time
        at: "17:15:00"
      - platform: time
        at: "17:30:00"
      - platform: time
        at: "17:45:00"
      - platform: time
        at: "18:00:00"
      - platform: time
        at: "18:15:00"
      - platform: time
        at: "18:30:00"
      - platform: time
