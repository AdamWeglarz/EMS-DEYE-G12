        at: "22:45:00"
  
    action:
      - variables:
          tz_to: "{{ now().strftime('%z')[0:3] ~ ':' ~ now().strftime('%z')[3:5] }}"
          dzis: "{{ now().date() }}"
          h_now: "{{ now().hour }}"
          m_now: "{{ now().minute }}"
          t_now: "{{ now().strftime('%H:%M') }}"
          was_discharging: "{{ is_state('input_boolean.battery_discharge_to_grid', 'on') }}"
          export_po22_active: >
            {% set planned_date = state_attr('var.magazyn_plan_export_po_22', 'planned_date') | default('', true) %}
            {% set enabled = (states('var.magazyn_plan_export_po_22') | int(0)) == 1
               or state_attr('var.magazyn_plan_export_po_22', 'enabled') in [true, 'True', 'true', 'on', 'ON'] %}
            {{ enabled and planned_date == (now().date() | string) }}
          export_end_hour: >
            {% set planned_date = state_attr('var.magazyn_plan_export_po_22', 'planned_date') | default('', true) %}
            {% set enabled = (states('var.magazyn_plan_export_po_22') | int(0)) == 1
               or state_attr('var.magazyn_plan_export_po_22', 'enabled') in [true, 'True', 'true', 'on', 'ON'] %}
            {{ 23 if (enabled and planned_date == (now().date() | string)) else 22 }}
  
          # Koszty / progi
          koszt_drozsza: "{{ states('var.magazyn_koszt_calkowity_strefa_drozsza_pln_kwh') | float(0) }}"
          koszt_tansza: "{{ states('var.magazyn_koszt_calkowity_strefa_tansza_pln_kwh') | float(0) }}"
          min_zysk_sprzedaz: "{{ states('var.magazyn_min_zysk_sprzedaz_pln_kwh') | float(0) }}"
          prog_czesciowy: >
            {{ (states('var.magazyn_koszt_calkowity_strefa_tansza_pln_kwh') | float(0))
               + (states('var.magazyn_min_zysk_sprzedaz_pln_kwh') | float(0)) }}
          prog_pelny: >
            {{ (states('var.magazyn_koszt_calkowity_strefa_drozsza_pln_kwh') | float(0))
               + (states('var.magazyn_min_zysk_sprzedaz_pln_kwh') | float(0)) }}
  
          # Bateria
          soc_now: "{{ states('sensor.solarman_battery_safe') | float(0) }}"
          pojemnosc_kwh: "{{ states('var.magazyn_pojemnosc_brutto_kwh') | float(15) }}"
          soc_floor_pct: "{{ states('var.magazyn_soc_floor_percent') | float(20) }}"
          soc_comfort_pct: "{{ states('var.magazyn_soc_comfort_percent') | float(25) }}"
          max_moc_rozladowania_kw: "{{ states('var.magazyn_max_moc_rozladowania_kw') | float(6) }}"
  
          # Zużycie
          cons_mult: "{{ states('var.magazyn_konsumpcja_multiplier') | float(1.15) }}"
          cons_default: "{{ states('var.magazyn_konsumpcja_default_kwh_h') | float(1.5) }}"
          urlop_kwh_h: "{{ states('var.magazyn_konsumpcja_urlop_kwh_h') | float(0.5) }}"
          sprzatanie_mult: "{{ states('var.magazyn_konsumpcja_mult_sprzatanie') | float(2.0) }}"
          lookback_sec: "{{ (states('var.magazyn_sql_lookback_days_ladowanie') | int(7)) * 86400 }}"

          # Dane
          ceny_data: "{{ state_attr('sensor.rce_prices_today_scaled', 'value') or [] }}"
  
      - service: sql.query
        data:
          query: >
            /* TEMP EMS1 2026-06-30: statyczna baza zuzycia z dni 2026-06-19..26 */
            SELECT slot, avg_h
            FROM (
              SELECT 0 AS slot, 0.450 AS avg_h
              UNION ALL SELECT 1 AS slot, 0.475 AS avg_h
              UNION ALL SELECT 2 AS slot, 0.488 AS avg_h
              UNION ALL SELECT 3 AS slot, 0.400 AS avg_h
              UNION ALL SELECT 4 AS slot, 0.338 AS avg_h
              UNION ALL SELECT 5 AS slot, 0.338 AS avg_h
              UNION ALL SELECT 6 AS slot, 0.350 AS avg_h
              UNION ALL SELECT 7 AS slot, 0.275 AS avg_h
              UNION ALL SELECT 8 AS slot, 0.263 AS avg_h
              UNION ALL SELECT 9 AS slot, 0.325 AS avg_h
              UNION ALL SELECT 10 AS slot, 0.300 AS avg_h
              UNION ALL SELECT 11 AS slot, 0.313 AS avg_h
              UNION ALL SELECT 12 AS slot, 0.288 AS avg_h
              UNION ALL SELECT 13 AS slot, 0.263 AS avg_h
              UNION ALL SELECT 14 AS slot, 0.350 AS avg_h
              UNION ALL SELECT 15 AS slot, 0.450 AS avg_h
              UNION ALL SELECT 16 AS slot, 0.538 AS avg_h
              UNION ALL SELECT 17 AS slot, 0.800 AS avg_h
              UNION ALL SELECT 18 AS slot, 0.850 AS avg_h
              UNION ALL SELECT 19 AS slot, 0.950 AS avg_h
              UNION ALL SELECT 20 AS slot, 0.988 AS avg_h
              UNION ALL SELECT 21 AS slot, 0.925 AS avg_h
              UNION ALL SELECT 22 AS slot, 0.913 AS avg_h
              UNION ALL SELECT 23 AS slot, 1.038 AS avg_h
              UNION ALL SELECT 24 AS slot, 0.975 AS avg_h
              UNION ALL SELECT 25 AS slot, 0.888 AS avg_h
              UNION ALL SELECT 26 AS slot, 0.775 AS avg_h
              UNION ALL SELECT 27 AS slot, 1.038 AS avg_h
              UNION ALL SELECT 28 AS slot, 1.300 AS avg_h
              UNION ALL SELECT 29 AS slot, 1.100 AS avg_h
              UNION ALL SELECT 30 AS slot, 0.825 AS avg_h
              UNION ALL SELECT 31 AS slot, 0.775 AS avg_h
              UNION ALL SELECT 32 AS slot, 0.663 AS avg_h
              UNION ALL SELECT 33 AS slot, 0.913 AS avg_h
              UNION ALL SELECT 34 AS slot, 0.800 AS avg_h
              UNION ALL SELECT 35 AS slot, 0.863 AS avg_h
              UNION ALL SELECT 36 AS slot, 0.850 AS avg_h
              UNION ALL SELECT 37 AS slot, 0.925 AS avg_h
              UNION ALL SELECT 38 AS slot, 1.125 AS avg_h
              UNION ALL SELECT 39 AS slot, 0.963 AS avg_h
              UNION ALL SELECT 40 AS slot, 1.000 AS avg_h
              UNION ALL SELECT 41 AS slot, 0.963 AS avg_h
              UNION ALL SELECT 42 AS slot, 0.975 AS avg_h
              UNION ALL SELECT 43 AS slot, 0.688 AS avg_h
              UNION ALL SELECT 44 AS slot, 0.538 AS avg_h
              UNION ALL SELECT 45 AS slot, 0.388 AS avg_h
              UNION ALL SELECT 46 AS slot, 0.500 AS avg_h
              UNION ALL SELECT 47 AS slot, 0.550 AS avg_h
            ) static_usage
            WHERE slot BETWEEN {{ h_now * 2 + (m_now // 30) }} AND {{ 45 if export_po22_active else 43 }}
            ORDER BY slot;
        response_variable: statystyki_wieczor

      - service: calendar.get_events
        target:
          entity_id: calendar.urlop
        data:
          start_date_time: "{{ now().strftime('%Y-%m-%d 00:00:00') }}"
          end_date_time: "{{ now().strftime('%Y-%m-%d 23:59:59') }}"
        response_variable: urlop_events

      - service: calendar.get_events
        target:
          entity_id: calendar.sprzatanie
        data:
          start_date_time: "{{ now().strftime('%Y-%m-%d 00:00:00') }}"
          end_date_time: "{{ now().strftime('%Y-%m-%d 23:59:59') }}"
        response_variable: sprzatanie_events

      - variables:
          pack: >-
            {% set slot_start_min = (m_now // 15) * 15 %}
            {% set slot_start_total = (h_now * 60 + slot_start_min) %}
            {% set dzis = now().date() %}
            {% set plan_date = dzis %}
            {% set export_end_h = export_end_hour | int(22) %}
            {% set export_end_slot_excl = export_end_h * 2 %}

            {# ===== URLOP: lista slotów (YYYY-MM-DD HH:MM) dla dzisiejszego planu ===== #}
            {% set urlop_list = (urlop_events['calendar.urlop'].events if (urlop_events and 'calendar.urlop' in urlop_events) else []) %}
            {% set urlop_ns = namespace(hours=[]) %}
            {% for ev in urlop_list %}
              {% set es = as_datetime(ev.start) | as_local %}
              {% set ee = as_datetime(ev.end) | as_local %}
              {% for off in range(0, 48) %}
                {% set probe = now().replace(hour=0, minute=0, second=0, microsecond=0) + timedelta(minutes=off*30) %}
                {% if probe >= es and probe < ee %}
                  {% set hk = probe.strftime('%Y-%m-%d %H:%M') %}
                  {% if hk not in urlop_ns.hours %}
                    {% set urlop_ns.hours = urlop_ns.hours + [hk] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {% set urlop_hours = urlop_ns.hours %}

            {# ===== SPRZATANIE: lista slotów (YYYY-MM-DD HH:MM) dla dzisiejszego planu ===== #}
            {% set sprzatanie_list = (sprzatanie_events['calendar.sprzatanie'].events if (sprzatanie_events and 'calendar.sprzatanie' in sprzatanie_events) else []) %}
            {% set sprzatanie_ns = namespace(hours=[]) %}
            {% for ev in sprzatanie_list %}
              {% set es = as_datetime(ev.start) | as_local %}
              {% set ee = as_datetime(ev.end) | as_local %}
              {% for off in range(0, 48) %}
                {% set probe = now().replace(hour=0, minute=0, second=0, microsecond=0) + timedelta(minutes=off*30) %}
                {% if probe >= es and probe < ee %}
                  {% set hk = probe.strftime('%Y-%m-%d %H:%M') %}
                  {% if hk not in sprzatanie_ns.hours %}
                    {% set sprzatanie_ns.hours = sprzatanie_ns.hours + [hk] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {% set sprzatanie_hours = sprzatanie_ns.hours %}

            {# --- aktualny slot i cena --- #}
            {% set nsS = namespace(period='', price_mwh=0.0) %}
            {% for c in ceny_data %}
              {% if c is mapping and c.period is defined %}
                {% set p = (c.period | string).replace('–', '-') %}
                {% set p2 = p.replace(' ', '') %}
                {% if '-' in p2 %}
                  {% set parts = p2.split('-') %}
                  {% set s = parts[0].split(':') %}
                  {% set e = parts[1].split(':') %}
                  {% if s | length == 2 and e | length == 2 %}
                    {% set st = (s[0] | int) * 60 + (s[1] | int) %}
                    {% set et = (e[0] | int) * 60 + (e[1] | int) %}
                    {% if slot_start_total >= st and slot_start_total < et %}
                      {% set nsS.period = c.period %}
                      {% set nsS.price_mwh = c.rce_pln | float(0) %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set current_slot_period = nsS.period %}
            {% set cena_kwh = (nsS.price_mwh | float(0)) / 1000 %}
  
            {# --- zużycie dict --- #}
            {% set rows = statystyki_wieczor['result'] if (statystyki_wieczor is mapping and 'result' in statystyki_wieczor) else [] %}
            {% set nsC = namespace(d={}) %}
            {% for row in rows %}
              {% set nsC.d = nsC.d | combine({ (row['slot'] | int): (row['avg_h'] | float(0)) }) %}
            {% endfor %}
            {% set dict_z = nsC.d %}
  
            {# --- PV dict 15-end: słownik slot→kWh (sloty 30-min) --- #}
            {% set forecast_data = state_attr('sensor.solcast_pv_forecast_prognoza_na_dzisiaj', 'detailedForecast') or [] %}

            {% set nsP = namespace(d={}) %}
            {% if forecast_data is iterable %}
              {% for item in forecast_data %}
                {% if item is mapping %}
                  {% set ps = item.get('period_start', item.get('datetime', '')) | string %}
                  {% if ps | length >= 16 %}
                    {% set ts_date = ps[0:10] %}
                    {% set ts_hour = ps[11:13] | int(-1) %}
                    {% set ts_min = ps[14:16] | int(0) %}
                    {% if ts_date == (dzis | string) and ts_hour >= 15 and ts_hour < export_end_h %}
                      {% set s_it = ts_hour * 2 + (ts_min // 30) %}
                      {% set pv_value = item.get('pv_estimate', item.get('pv_forecast', 0)) | float(0) / 2 %}
                      {% set nsP.d = nsP.d | combine({ s_it: pv_value }) %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {% set pv_d = nsP.d %}
            {% set pv_count = pv_d | length %}
            {% set pv_hours_debug =
              'src=detailedForecast' ~
              ' | fc_len=' ~ (forecast_data | list | count) ~
              ' | pv_count=' ~ pv_count ~
              ' | dzis=' ~ dzis ~
              ' | pv_d=' ~ pv_d %}
  
            {# --- energia użyteczna teraz --- #}
            {% set floor_kwh = pojemnosc_kwh * soc_floor_pct / 100 %}
            {% set max_u = pojemnosc_kwh - floor_kwh %}
            {% set E0_u = (soc_now / 100) * pojemnosc_kwh - floor_kwh %}
            {% if E0_u < 0 %}
              {% set E0_u = 0 %}
            {% endif %}
            {% if E0_u > max_u %}
              {% set E0_u = max_u %}
            {% endif %}
  
            {% set E_reserve_u = (pojemnosc_kwh * soc_comfort_pct / 100) - floor_kwh %}
            {% if E_reserve_u < 0 %}
              {% set E_reserve_u = 0 %}
            {% endif %}
            {% if E_reserve_u > max_u %}
              {% set E_reserve_u = max_u %}
            {% endif %}
  
            {# --- zmienne slotowe --- #}
            {% set cons_default_slot = cons_default | float(1.5) / 2 %}
            {% set urlop_kwh_slot = urlop_kwh_h | float(0.5) / 2 %}
            {% set s_now = h_now * 2 + (m_now // 30) %}
            {% set current_slot_factor = ((1800 - (m_now % 30 * 60 + now().second)) / 1800) | float(0) %}

            {# --- zapotrzebowanie domu od teraz do końca sesji --- #}
            {% set ns_cons = namespace(total=0.0) %}
            {% for s in range(s_now, export_end_slot_excl) %}
              {% set hk = plan_date.strftime('%Y-%m-%d') ~ ' ' ~ '%02d:%02d'|format(s // 2, (s % 2) * 30) %}
              {% set is_urlop_h = hk in urlop_hours %}
              {% set is_sprzatanie_h = hk in sprzatanie_hours %}
              {% set z_h = (dict_z.get(s, cons_default_slot)) * sprzatanie_mult if is_sprzatanie_h else (urlop_kwh_slot if is_urlop_h else (dict_z.get(s, cons_default_slot)) * cons_mult) %}
              {% set factor = current_slot_factor if s == s_now else 1 %}
              {% set ns_cons.total = ns_cons.total + (z_h * factor) %}
            {% endfor %}
            {% set calkowite_zuzycie_kwh = ns_cons.total %}

            {% set ns_pv_sum = namespace(total=0.0) %}
            {% for s in range(s_now, export_end_slot_excl) %}
              {% set pv_h = pv_d.get(s, 0) %}
              {% set factor = current_slot_factor if s == s_now else 1 %}
              {% set ns_pv_sum.total = ns_pv_sum.total + (pv_h * factor) %}
            {% endfor %}
            {% set calkowite_pv_kwh = ns_pv_sum.total %}
  
            {% set energia_dom_z_baterii_do_end = calkowite_zuzycie_kwh - calkowite_pv_kwh %}
            {% if energia_dom_z_baterii_do_end < 0 %}
              {% set energia_dom_z_baterii_do_end = 0 %}
            {% endif %}
  
            {# --- partial baseline: realnie dostępny budżet (informacyjnie) --- #}
            {% set E_required_partial = energia_dom_z_baterii_do_end + E_reserve_u %}
            {% set sellable_partial_baseline = E0_u - E_required_partial %}
            {% if sellable_partial_baseline < 0 %}
              {% set sellable_partial_baseline = 0 %}
            {% endif %}

            {# --- full: można zejść do floor, bez patrzenia na przetrwanie do końca sesji --- #}
            {% set sellable_full_now = E0_u %}
            {% if sellable_full_now < 0 %}
              {% set sellable_full_now = 0 %}
            {% endif %}

            {# --- Bilansowanie godzinne 1/2: NIETYKALNY bufor do końca bieżącej godziny ---
                 Prawo: rozliczanie jest godzinne (netting w oknie 60 min).
                 Nie oddajemy z baterii tego, czego będziemy potrzebować do końca bieżącej
                 godziny rozliczeniowej — bo import w tej samej godzinie anuluje eksport.

                 Budżet eksportu = E0_u - zużycie_bieżącego_slotu - reserve_po_slocie
                 Przykład: mamy 0.5 kWh, dom zużyje 0.3 kWh w tym slocie, reserve=0
                 → eksportujemy tylko 0.2 kWh i stopujemy.

                 Dodatkowo FULL odkłada 1 pp. SOC na każdy pełny kwadrans po
                 bieżącym slocie, ale nigdy mniej niż 1 pp. Dzięki temu nawet
                 w ostatnim slocie godziny nie schodzimy do samego floor.

                 SOC stop = floor + reserve_po_slocie + bufor_SOC
                 (po zakończeniu slotu zostaje energia na dom oraz bufor) #}
            {% set slot_end_min = slot_start_min + 15 %}
            {% set mins_rest_of_hour = 60 - slot_end_min %}
            {% set ns_zh_eoh = namespace(v=0.0) %}
            {% for s_eoh in [h_now * 2, h_now * 2 + 1] %}
              {% set hk_eoh = plan_date.strftime('%Y-%m-%d') ~ ' ' ~ '%02d:%02d'|format(h_now, (s_eoh % 2) * 30) %}
              {% set is_urlop_eoh = hk_eoh in urlop_hours %}
              {% set is_sprz_eoh = hk_eoh in sprzatanie_hours %}
              {% set z_eoh_s = (dict_z.get(s_eoh, cons_default_slot)) * sprzatanie_mult if is_sprz_eoh else (urlop_kwh_slot if is_urlop_eoh else (dict_z.get(s_eoh, cons_default_slot)) * cons_mult) %}
              {% set ns_zh_eoh.v = ns_zh_eoh.v + z_eoh_s %}
            {% endfor %}
            {% set z_h_eoh = ns_zh_eoh.v %}
            {% set pv_h_eoh = pv_d.get(h_now * 2, 0) + pv_d.get(h_now * 2 + 1, 0) %}
            {% set house_kwh_this_slot = [z_h_eoh * 15 / 60 - pv_h_eoh * 15 / 60, 0] | max %}
            {% set reserve_do_konca_godziny_kwh = [z_h_eoh * mins_rest_of_hour / 60 - pv_h_eoh * mins_rest_of_hour / 60, 0] | max %}
            {% set pelne_sloty_po_biezacym = (mins_rest_of_hour / 15) | int(0) %}
            {% set bufor_soc_do_konca_godziny_pct = [pelne_sloty_po_biezacym, 1] | max %}
            {% set bufor_soc_do_konca_godziny_kwh = pojemnosc_kwh * bufor_soc_do_konca_godziny_pct / 100 %}
            {% set rezerwa_full_do_konca_godziny_kwh = reserve_do_konca_godziny_kwh + bufor_soc_do_konca_godziny_kwh %}
            {% set sellable_full_now = [sellable_full_now - rezerwa_full_do_konca_godziny_kwh - house_kwh_this_slot, 0] | max %}
  
            {% set battery_slot_u_full = max_moc_rozladowania_kw * 0.25 %}
            {% if battery_slot_u_full < 0 %}
              {% set battery_slot_u_full = 0 %}
            {% endif %}
  
            {# --- kandydaci --- #}
            {% set ns = namespace(full=[], partial=[]) %}
            {% for c in ceny_data %}
              {% if c is mapping and c.period is defined %}
                {% set p = (c.period | string).replace('–', '-') %}
                {% set p2 = p.replace(' ', '') %}
                {% if '-' in p2 %}
                  {% set parts = p2.split('-') %}
                  {% set start = parts[0] %}
                  {% set hm = start.split(':') %}
                  {% if hm | length == 2 %}
                    {% set h = hm[0] | int %}
                    {% set m = hm[1] | int %}
                    {% set st = h * 60 + m %}
                    {% set price_kwh = (c.rce_pln | float(0)) / 1000 %}
                    {% if h >= 15 and h < export_end_h and st >= slot_start_total and price_kwh >= prog_czesciowy %}
                      {% set pv_h = pv_d.get(h*2, 0) + pv_d.get(h*2+1, 0) %}
                      {% set hk0 = plan_date.strftime('%Y-%m-%d') ~ ' ' ~ '%02d:00'|format(h) %}
                      {% set hk1 = plan_date.strftime('%Y-%m-%d') ~ ' ' ~ '%02d:30'|format(h) %}
              {% set is_urlop_h = hk0 in urlop_hours or hk1 in urlop_hours %}
              {% set is_sprzatanie_h = hk0 in sprzatanie_hours or hk1 in sprzatanie_hours %}
              {% set z_h0 = (dict_z.get(h*2, cons_default_slot)) * sprzatanie_mult if is_sprzatanie_h else (urlop_kwh_slot if is_urlop_h else (dict_z.get(h*2, cons_default_slot)) * cons_mult) %}
              {% set z_h1 = (dict_z.get(h*2+1, cons_default_slot)) * sprzatanie_mult if is_sprzatanie_h else (urlop_kwh_slot if is_urlop_h else (dict_z.get(h*2+1, cons_default_slot)) * cons_mult) %}
              {% set z_h = z_h0 + z_h1 %}
                      {% set base_delta_slot = (pv_h - z_h) / 4 %}
                      {% if price_kwh >= prog_pelny %}
                        {% set ns.full = ns.full + [{
                          'period': c.period,
                          'price_mwh': (c.rce_pln | float(0)),
                          'price_kwh': price_kwh,
                          'base_delta': base_delta_slot,
                          'batt_cap': battery_slot_u_full,
                          'mode': 'full'
                        }] %}
                      {% else %}
                        {% set ns.partial = ns.partial + [{
                          'period': c.period,
                          'price_mwh': (c.rce_pln | float(0)),
                          'price_kwh': price_kwh,
                          'base_delta': base_delta_slot,
                          'batt_cap': battery_slot_u_full,
                          'mode': 'partial'
                        }] %}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
  
            {% set full_sorted = ns.full | sort(attribute='price_kwh', reverse=true) %}
            {% set partial_sorted = ns.partial | sort(attribute='price_kwh', reverse=true) %}
  
            {# --- wybór FULL: maksymalnie do floor, bez patrzenia na koniec sesji --- #}
            {% set nsFull = namespace(rem=sellable_full_now, chosen=[], batt_sum=0.0, export_sum=0.0, lines='') %}
            {% for s in full_sorted %}
              {% if nsFull.rem > 0.001 %}
                {% set batt_use = [s.batt_cap, nsFull.rem] | min %}
                {% if batt_use < 0 %}
                  {% set batt_use = 0 %}
                {% endif %}
                {% set export_energy = s.base_delta + batt_use %}
                {% if export_energy < 0 %}
                  {% set export_energy = 0 %}
                {% endif %}
                {% if batt_use > 0 or export_energy > 0 %}
                  {% set nsFull.chosen = nsFull.chosen + [{
                    'period': s.period,
                    'price_kwh': s.price_kwh,
                    'price_mwh': s.price_mwh,
                    'batt_use': batt_use,
                    'export_energy': export_energy,
                    'mode': 'full'
                  }] %}
                  {% set nsFull.rem = nsFull.rem - batt_use %}
                  {% set nsFull.batt_sum = nsFull.batt_sum + batt_use %}
                  {% set nsFull.export_sum = nsFull.export_sum + export_energy %}
                  {% set nsFull.lines = nsFull.lines ~
                    "\n- " ~ s.period ~
                    " | " ~ (s.price_mwh | round(1)) ~ " PLN/MWh" ~
                    " | mode:full" ~
                    " | bat:" ~ (batt_use | round(3)) ~ " kWh" ~
                    " | export:" ~ (export_energy | round(3)) ~ " kWh"
                  %}
                {% endif %}
              {% endif %}
            {% endfor %}
  
            {# --- PARTIAL dostaje tylko resztę budżetu po FULL,
                 ale nigdy więcej niż sellable_partial_baseline (= 0 przy bilansowaniu 1/2) --- #}
            {% set E_after_full = E0_u - nsFull.batt_sum %}
            {% if E_after_full < 0 %}
              {% set E_after_full = 0 %}
            {% endif %}

            {% set sellable_partial_after_full = E_after_full - E_required_partial %}
            {% if sellable_partial_after_full < 0 %}
              {% set sellable_partial_after_full = 0 %}
            {% endif %}
            {% if sellable_partial_after_full > sellable_partial_baseline %}
              {% set sellable_partial_after_full = sellable_partial_baseline %}
            {% endif %}
  
            {# --- wybór PARTIAL: batt_use steruje rozładowaniem, export_energy to eksport netto BAT + PV - dom --- #}
            {% set nsPart = namespace(rem=sellable_partial_after_full, chosen=[], batt_sum=0.0, export_sum=0.0, lines='') %}
            {% for s in partial_sorted %}
              {% if nsPart.rem > 0.001 %}
                {% set batt_use = [s.batt_cap, nsPart.rem] | min %}
                {% if batt_use < 0 %}
                  {% set batt_use = 0 %}
                {% endif %}
                {% set export_energy = s.base_delta + batt_use %}
                {% if export_energy < 0 %}
                  {% set export_energy = 0 %}
                {% endif %}
                {% if batt_use > 0 or export_energy > 0 %}
                  {% set nsPart.chosen = nsPart.chosen + [{
                    'period': s.period,
                    'price_kwh': s.price_kwh,
                    'price_mwh': s.price_mwh,
                    'batt_use': batt_use,
                    'export_energy': export_energy,
                    'mode': 'partial'
                  }] %}
                  {% set nsPart.rem = nsPart.rem - batt_use %}
                  {% set nsPart.batt_sum = nsPart.batt_sum + batt_use %}
                  {% set nsPart.export_sum = nsPart.export_sum + export_energy %}
                  {% set nsPart.lines = nsPart.lines ~
                    "\n- " ~ s.period ~
                    " | " ~ (s.price_mwh | round(1)) ~ " PLN/MWh" ~
                    " | mode:partial" ~
                    " | bat:" ~ (batt_use | round(3)) ~ " kWh" ~
                    " | export:" ~ (export_energy | round(3)) ~ " kWh"
                  %}
                {% endif %}
              {% endif %}
            {% endfor %}
  
            {# --- plan łączny, FULL ma priorytet biznesowy i budżetowy --- #}
            {% set chosen_all = nsFull.chosen + nsPart.chosen %}
            {% set plan_list = chosen_all | map(attribute='period') | list %}
            {% set in_plan_now = current_slot_period in plan_list %}
            {% set top_lines = nsFull.lines ~ nsPart.lines %}
  
            {# --- parametry bieżącego slotu --- #}
            {% set nsCur = namespace(batt_use=0.0, export_energy=0.0, mode='partial') %}
            {% for s in chosen_all %}
              {% if s.period == current_slot_period %}
                {% set nsCur.batt_use = s.batt_use %}
                {% set nsCur.export_energy = s.export_energy %}
                {% set nsCur.mode = s.mode %}
              {% endif %}
            {% endfor %}
  
            {% set soc_stop_target = (((E0_u - nsCur.batt_use + floor_kwh) / pojemnosc_kwh) * 100) | round(0) | int %}
            {% if nsCur.mode == 'full' %}
              {% set soc_stop_target = (((floor_kwh + rezerwa_full_do_konca_godziny_kwh) / pojemnosc_kwh) * 100) | round(0) | int %}
            {% endif %}
            {% if soc_stop_target > 100 %}
              {% set soc_stop_target = 100 %}
            {% endif %}
            {% if soc_stop_target < (soc_floor_pct | int(20)) %}
              {% set soc_stop_target = soc_floor_pct | int(20) %}
            {% endif %}
  
            {% set should_partial_now = cena_kwh >= prog_czesciowy %}
            {% set should_full_now = cena_kwh >= prog_pelny %}

            {% set E_after_plan_end = E0_u - nsFull.batt_sum - nsPart.batt_sum - energia_dom_z_baterii_do_end %}
            {% if E_after_plan_end < 0 %}
              {% set E_after_plan_end = 0 %}
            {% endif %}
            {% set soc_expected_end = (((E_after_plan_end + floor_kwh) / pojemnosc_kwh) * 100) | round(1) %}
            {% if soc_expected_end > 100 %}
              {% set soc_expected_end = 100 %}
            {% endif %}

  
            {{ current_slot_period }}###{{ cena_kwh | round(4) }}###{{ soc_stop_target }}###{{ pv_hours_debug }}###{{ E0_u | round(2) }}###{{ E_required_partial | round(2) }}###{{ E_reserve_u | round(2) }}###{{ sellable_partial_baseline | round(2) }}###{{ sellable_partial_after_full | round(2) }}###{{ sellable_full_now | round(2) }}###{{ battery_slot_u_full | round(2) }}###{{ (full_sorted | length) }}###{{ (partial_sorted | length) }}###{{ (plan_list | length) }}###{{ nsFull.batt_sum | round(2) }}###{{ nsPart.batt_sum | round(2) }}###{{ (nsFull.export_sum + nsPart.export_sum) | round(2) }}###{{ plan_list | join('|') }}###{{ in_plan_now }}###{{ top_lines }}###{{ nsCur.batt_use | round(3) }}###{{ nsCur.export_energy | round(3) }}###{{ nsCur.mode }}###{{ 'YES' if should_partial_now else 'NO' }}###{{ 'YES' if should_full_now else 'NO' }}###{{ soc_expected_end }}###{{ reserve_do_konca_godziny_kwh | round(3) }}###{{ house_kwh_this_slot | round(3) }}###{{ export_end_h }}###{{ 'YES' if export_end_h == 23 else 'NO' }}
  
      - variables:
          slot_period: "{{ pack.split('###')[0] }}"
          cena_kwh_dbg: "{{ pack.split('###')[1] | float(0) }}"
          soc_stop_target: "{{ pack.split('###')[2] | int(20) }}"
          pv_hours: "{{ pack.split('###')[3] }}"
          E0_u: "{{ pack.split('###')[4] | float(0) }}"
          E_required_partial: "{{ pack.split('###')[5] | float(0) }}"
          E_reserve_u: "{{ pack.split('###')[6] | float(0) }}"
          sellable_partial_baseline: "{{ pack.split('###')[7] | float(0) }}"
          sellable_partial_now: "{{ pack.split('###')[8] | float(0) }}"
          sellable_full_now: "{{ pack.split('###')[9] | float(0) }}"
          battery_slot_u_full: "{{ pack.split('###')[10] | float(0) }}"
          full_candidate_count: "{{ pack.split('###')[11] | int(0) }}"
          partial_candidate_count: "{{ pack.split('###')[12] | int(0) }}"
          plan_count: "{{ pack.split('###')[13] | int(0) }}"
          plan_batt_sum_full: "{{ pack.split('###')[14] | float(0) }}"
          plan_batt_sum_partial: "{{ pack.split('###')[15] | float(0) }}"
          plan_export_sum: "{{ pack.split('###')[16] | float(0) }}"
          plan_slotow: "{{ pack.split('###')[17] }}"
          plan_list: "{{ plan_slotow.split('|') if plan_slotow | length > 0 else [] }}"
          in_plan_now: "{{ pack.split('###')[18] == 'True' }}"
          top_lines: "{{ pack.split('###')[19] }}"
          current_slot_batt_use: "{{ pack.split('###')[20] | float(0) }}"
          current_slot_export_energy: "{{ pack.split('###')[21] | float(0) }}"
          current_slot_mode: "{{ pack.split('###')[22] }}"
          should_partial_now: "{{ pack.split('###')[23] == 'YES' }}"
          should_full_now: "{{ pack.split('###')[24] == 'YES' }}"
          soc_expected_end: "{{ pack.split('###')[25] | float(0) }}"
          reserve_do_konca_godziny_kwh: "{{ pack.split('###')[26] | float(0) }}"
          house_kwh_this_slot: "{{ pack.split('###')[27] | float(0) }}"
          export_end_hour_dbg: "{{ pack.split('###')[28] | int(22) }}"
          export_po22_active_dbg: "{{ pack.split('###')[29] == 'YES' }}"
  
      # --- EMS1 plan vs realizacja: zamknij poprzedni slot, otwórz nowy ---
      - variables:
          ems1_total_sold_now: "{{ states('sensor.solarman_total_energy_sold_safe') | float(0) }}"
          ems1_slot_snap_prev: "{{ states('var.ems1_slot_snap_kwh') | float(0) }}"
          ems1_is_first_slot_w: "{{ t_now == '15:00' }}"
          ems1_actual_prev_slot_w: >
            {% set delta = ems1_total_sold_now - ems1_slot_snap_prev %}
            {{ [delta, 0] | max | round(4) }}

      - service: var.set
        data:
          entity_id: var.ems1_session_actual_total_kwh
          value: >
            {% if ems1_is_first_slot_w %}
              0
            {% else %}
              {{ ((states('var.ems1_session_actual_total_kwh') | float(0)) + ems1_actual_prev_slot_w) | round(4) }}
            {% endif %}

      - service: var.set
        data:
          entity_id: var.ems1_session_plan_total_kwh
          value: >
            {% if ems1_is_first_slot_w %}
              {{ current_slot_export_energy | float(0) | round(4) }}
            {% else %}
              {{ ((states('var.ems1_session_plan_total_kwh') | float(0)) + (current_slot_export_energy | float(0))) | round(4) }}
            {% endif %}

      - service: var.set
        data:
          entity_id: var.ems1_slot_snap_kwh
          value: "{{ ems1_total_sold_now }}"
          attributes:
            slot: "{{ slot_period }}"
            plan_kwh: "{{ current_slot_export_energy | round(4) }}"
            actual_prev_kwh: "{{ ems1_actual_prev_slot_w | round(4) }}"
            first_slot: "{{ ems1_is_first_slot_w }}"

      - service: var.set
        data:
          entity_id: var.magazyn_soc_stop_export_wieczor
          value: "{{ soc_stop_target }}"
          attributes:
            last_update: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            time: "{{ t_now }}"
            slot: "{{ slot_period }}"
            cena_pln_kwh: "{{ cena_kwh_dbg }}"
            prog_partial: "{{ prog_czesciowy }}"
            prog_full: "{{ prog_pelny }}"
            should_full: "{{ should_full_now }}"
            should_partial: "{{ should_partial_now }}"
            in_plan_now: "{{ in_plan_now }}"
            current_slot_mode: "{{ current_slot_mode }}"
            current_slot_batt_use: "{{ current_slot_batt_use }}"
            current_slot_export_energy: "{{ current_slot_export_energy }}"
            sellable_partial_baseline: "{{ sellable_partial_baseline }}"
            sellable_partial_now: "{{ sellable_partial_now }}"
            sellable_full_now: "{{ sellable_full_now }}"
            plan_count: "{{ plan_count }}"
            full_candidate_count: "{{ full_candidate_count }}"
            partial_candidate_count: "{{ partial_candidate_count }}"
            plan_batt_sum_full: "{{ plan_batt_sum_full }}"
            plan_batt_sum_partial: "{{ plan_batt_sum_partial }}"
            plan_export_sum: "{{ plan_export_sum }}"
            pv_hours: "{{ pv_hours }}"
            soc_expected_end: "{{ soc_expected_end }}"
            export_end_hour: "{{ export_end_hour_dbg }}"
            export_po22_active: "{{ export_po22_active_dbg }}"
      - service: system_log.write
        data:
          level: warning
          message: >
            EXPORT_WIECZOR {{ t_now }} slot="{{ slot_period }}" price={{ cena_kwh_dbg | round(3) }}
            | end={{ export_end_hour_dbg }}:00 po22={{ 'YES' if export_po22_active_dbg else 'NO' }}
            | prog_partial={{ prog_czesciowy | round(3) }} prog_full={{ prog_pelny | round(3) }}
            | SOC={{ soc_now | round(1) }}% stop={{ soc_stop_target }}%
            | E0={{ E0_u }} EreqPartial={{ E_required_partial }} Eres={{ E_reserve_u }}
            | sell_partial_base={{ sellable_partial_baseline }} sell_partial_after_full={{ sellable_partial_now }} sell_full={{ sellable_full_now }}
            | full_candidates={{ full_candidate_count }} partial_candidates={{ partial_candidate_count }} plan={{ plan_count }}
            | batt_full={{ plan_batt_sum_full }} batt_partial={{ plan_batt_sum_partial }} export_sum={{ plan_export_sum }}
            | slot_mode={{ current_slot_mode }} current_batt={{ current_slot_batt_use }} current_export={{ current_slot_export_energy }}
            | in_plan={{ 'YES' if in_plan_now else 'NO' }}
            | pv_hours={{ pv_hours }}
  
      - choose:
          - conditions:
              - condition: template
                # value_template: "{{ t_now == '15:00' }}"
                value_template: "{{ true }}"
            sequence:
              - service: script.ems_notify
                data:
                  title: "📊 Plan eksportu wieczornego"
                  message: >
                    🎯 Budżet baterii:
                    - PARTIAL baseline (bez priorytetu FULL): {{ sellable_partial_baseline | round(2) }} kWh
                    - PARTIAL po alokacji FULL: {{ sellable_partial_now | round(2) }} kWh
                    - FULL (maks do floor): {{ sellable_full_now | round(2) }} kWh
                    - 🔒 Rezerwa po slocie (reszta godz.): {{ reserve_do_konca_godziny_kwh | round(3) }} kWh
                    - 🏠 Zużycie domu ten slot: {{ house_kwh_this_slot | round(3) }} kWh
  
                    📦 Plan:
                    - Slotów: {{ plan_count }}
                    - FULL kandydatów: {{ full_candidate_count }}
                    - PARTIAL kandydatów: {{ partial_candidate_count }}
                    - Energia z baterii FULL: {{ plan_batt_sum_full | round(2) }} kWh
                    - Energia z baterii PARTIAL: {{ plan_batt_sum_partial | round(2) }} kWh
                    - Szac. eksport: {{ plan_export_sum | round(2) }} kWh
                    - Dane PV: {{ pv_hours }}
  
                    💰 Najlepsze sloty:{{ top_lines }}
  
                    🔋 SOC: {{ soc_now | round(1) }}%
                    🕒 Koniec sesji: {{ export_end_hour_dbg }}:00
                    🌙 Eksport po 22: {{ 'TAK' if export_po22_active_dbg else 'NIE' }}
                    🛡️ Komfort do {{ export_end_hour_dbg }}:00: {{ soc_comfort_pct }}%
                    🛡️ Floor techniczny: {{ soc_floor_pct }}%
                    🔮 Spodziewany SOC o {{ export_end_hour_dbg }}:00: {{ soc_expected_end }}%
  
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ not in_plan_now or current_slot_batt_use <= 0 }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.battery_discharge_to_grid
  
              - delay: "00:00:03"
  
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ was_discharging }}"
                    sequence:
                      - service: script.ems_notify
                        data:
                          title: "⏸️ STOP eksportu - poza planem"
                          message: >
                            {{ t_now }} | Slot {{ slot_period }}
                            | Cena: {{ cena_kwh_dbg | round(3) }} PLN/kWh
                            | W planie: {{ 'TAK' if in_plan_now else 'NIE' }}
                            | Tryb slotu: {{ current_slot_mode }}
                            | Bateria slot: {{ current_slot_batt_use | round(3) }} kWh
                            | SOC: {{ soc_now | round(1) }}%
  
          - conditions:
              - condition: template
                value_template: "{{ soc_now <= soc_stop_target }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.battery_discharge_to_grid
  
              - delay: "00:00:03"
  
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ was_discharging }}"
                    sequence:
                      - service: script.ems_notify
                        data:
                          title: "⚠️ STOP eksportu - osiągnięto SOC stop"
                          message: >
                            {{ t_now }} | SOC: {{ soc_now | round(1) }}% <= {{ soc_stop_target }}%
                            | Slot: {{ slot_period }}
                            | Tryb slotu: {{ current_slot_mode }}
  
          - conditions:
              - condition: template
                value_template: "{{ in_plan_now and soc_now > soc_stop_target and current_slot_batt_use > 0 }}"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.battery_discharge_to_grid
  
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ not was_discharging }}"
                    sequence:
                      - service: script.ems_notify
                        data:
                          title: "🚀 START eksportu wieczornego"
                          message: >
                            {{ t_now }} | Slot {{ slot_period }}
                            | Cena: {{ cena_kwh_dbg | round(3) }} PLN/kWh
                            | Tryb: {{ current_slot_mode | upper }}
                            | Plan slotu:
                            - bateria: {{ current_slot_batt_use | round(3) }} kWh
                            - szac. eksport: {{ current_slot_export_energy | round(3) }} kWh
                            | SOC: {{ soc_now | round(1) }}% > {{ soc_stop_target }}%
  
        default:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.battery_discharge_to_grid
  
          - delay: "00:00:03"
  
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ t_now == ('22:45' if export_po22_active_dbg else '21:45') }}"
            sequence:
              - service: script.ems_notify
                data:
                  title: "📈 Podsumowanie eksportu wieczornego"
                  message: >
                    {% set sess_plan_w = states('var.ems1_session_plan_total_kwh') | float(0) %}
                    {% set sess_actual_w = states('var.ems1_session_actual_total_kwh') | float(0) %}
                    {% set eff_w = (sess_actual_w / sess_plan_w * 100) | round(1) if sess_plan_w > 0.01 else 0 %}
                    {% set daily_sold = states('sensor.solarman_daily_energy_sold') | float(0) %}
                    📊 Plan vs Realizacja (sesja 15–{{ export_end_hour_dbg }}):
                    - Plan:        {{ sess_plan_w | round(2) }} kWh
                    - Realizacja:  {{ sess_actual_w | round(2) }} kWh
                    - Efektywność: {{ eff_w }}%

                    📋 Total dzienny: {{ daily_sold | round(2) }} kWh

                    📦 Plan ostatniego slotu:
                    - Slotów: {{ plan_count }}
                    - FULL kandydatów: {{ full_candidate_count }}
                    - PARTIAL kandydatów: {{ partial_candidate_count }}
                    - Energia z baterii FULL: {{ plan_batt_sum_full | round(2) }} kWh
                    - Energia z baterii PARTIAL: {{ plan_batt_sum_partial | round(2) }} kWh
                    - Szac. eksport: {{ plan_export_sum | round(2) }} kWh

                    🔋 SOC teraz: {{ soc_now | round(1) }}%
                    🛡️ SOC stop dla tego slotu: {{ soc_stop_target }}%
                    ☀️ PV debug: {{ pv_hours }}
                    🔮 Spodziewany SOC o {{ export_end_hour_dbg }}:00: {{ soc_expected_end }}%


###############################################################################
# (2) STOPPER: reaguj na SOC i wyłącz oddawanie, gdy osiągniemy zapisany próg
###############################################################################
  - alias: "Magazyn: STOP eksport wieczór – SOC <= próg"
    id: magazyn_stop_export_wieczor_soc
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.solarman_battery_safe

    action:
      - variables:
          soc_now: "{{ states('sensor.solarman_battery_safe') | float(0) }}"
          soc_stop: "{{ states('var.magazyn_soc_stop_export_wieczor') | float(20) }}"
          discharging: "{{ is_state('input_boolean.battery_discharge_to_grid', 'on') }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ discharging and soc_now <= soc_stop }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.battery_discharge_to_grid
              - service: system_log.write
                data:
                  level: warning
                  message: >
                    STOPPER_WIECZOR: SOC {{ soc_now | round(1) }}% <= {{ soc_stop | round(0) }}% -> battery_discharge_to_grid OFF
        default: []

  - alias: "Magazyn: Utrzymaj SOC pod eksport strategiczny"
    id: magazyn_strategiczny_hold_soc
    mode: restart
    trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: state
        entity_id:
          - sensor.srednia_moc_z_pv_5_minut
          - sensor.srednia_moc_pobierana_przez_dom_2_5_minut
          - var.magazyn_strategiczny_hold_soc
    condition:
      - condition: time
        after: "15:00:00"
        before: "23:00:00"
    action:
      - variables:
          enabled: "{{ state_attr('var.magazyn_strategiczny_hold_soc', 'enabled') in [true, 'True', 'true'] }}"
          slots: "{{ (state_attr('var.magazyn_strategiczny_hold_soc', 'slots') | default('', true)).split('|') }}"
          target_soc: "{{ states('var.magazyn_strategiczny_hold_soc') | float(0) }}"
          soc_now: "{{ states('sensor.solarman_battery_safe') | float(0) }}"
          pv_w: "{{ states('sensor.srednia_moc_z_pv_5_minut') | float(0) }}"
          house_w: "{{ [states('sensor.srednia_moc_pobierana_przez_dom_2_5_minut') | float(0), 0] | max }}"
          now_period: "{{ now().strftime('%H:%M') }}"
          now_hour: "{{ now().hour }}"
          now_minute_of_day: "{{ now().hour * 60 + now().minute }}"
          battery_export_active: "{{ is_state('input_boolean.battery_discharge_to_grid', 'on') }}"
      - variables:
          current_slot_export: >-
            {% set ns = namespace(v=false) %}
            {% for p_raw in slots %}
              {% set p = (p_raw | string).replace('–', '-').replace(' ', '') %}
              {% if '-' in p %}
                {% set parts = p.split('-') %}
                {% set start = parts[0].split(':') %}
                {% set end = parts[1].split(':') %}
                {% if start | length == 2 and end | length == 2 %}
                  {% set start_min = (start[0] | int) * 60 + (start[1] | int) %}
                  {% set end_min = (end[0] | int) * 60 + (end[1] | int) %}
                  {% if now_minute_of_day | int >= start_min and now_minute_of_day | int < end_min %}
                    {% set ns.v = true %}
                  {% endif %}
                {% endif %}
              {% elif p.startswith(now_period) %}
                {% set ns.v = true %}
              {% endif %}
            {% endfor %}
            {{ ns.v }}
          export_this_hour: >-
            {% set ns = namespace(v=false) %}{% for p in slots %}{% if p.startswith('%02d:'|format(now_hour)) %}{% set ns.v = true %}{% endif %}{% endfor %}{{ ns.v }}
          pv_covers_house: "{{ pv_w >= house_w }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ enabled and (slots == [''] or current_slot_export or battery_export_active or pv_covers_house) }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.battery_charge_from_grid
          - conditions:
              - condition: template
                value_template: "{{ enabled }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.manual_battery_charge_limit
                data:
                  value: "{{ [target_soc, soc_now] | min if export_this_hour else target_soc }}"
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.battery_charge_from_grid



  ###############################################################################
  # NOCNA BLOKADA ROZŁADOWANIA (22:00 / warunkowo 23:00)
  # v3.11:
  # - FULL = koszt_drozsza + min_zysk_sprzedaz
  # - PARTIAL = koszt_tansza + min_zysk_sprzedaz
  # - wybór slotów po cenie malejąco
  # - automat pełni rolę blokady, nie planera ładowania
  ###############################################################################

  - id: magazyn_blokada_rozladowania_noc_v3_11_plan_na_jutro
    alias: "Magazyn: Blokada rozładowania na noc (22/23) v3.12"
    description: >
      O 22:00, albo o 23:00 tylko gdy zaplanowano eksport po 22:
      - sprawdza dostępność danych PV na jutro
      - analizuje ceny rano (06:00-13:00)
      - analizuje prognozę PV na jutro
      - sprawdza, czy jutro będzie prawdziwy spill (overflow magazynu >100%)
      - jeśli spill + użyteczne sloty cenowe dla obecnego budżetu baterii:
        zostawia energię na poranny eksport + przetrwanie
      - jeśli spill bez użytecznych slotów: zostawia tylko energię na przetrwanie
      - jeśli brak spillu: zostawia tylko energię na przetrwanie
      - v3.11:
        * FULL = koszt_drozsza + min_zysk_sprzedaz
        * PARTIAL = koszt_tansza + min_zysk_sprzedaz
        * wybór slotów po cenie malejąco
        * automat pełni rolę blokady, nie planera ładowania
        * booked_soc nie spadnie poniżej var.magazyn_soc_min_rano_percent (floor rano)
      - v3.12:
        * gdy var.magazyn_plan_export_po_22 jest aktywny, 22:00 pomija booking
          i wykonuje go dopiero o 23:00
        * gdy flaga nie jest aktywna, 23:00 nic nie robi
        * przed bookingiem resetuje poranny floor SOC do bazowych 25%
    mode: single
  
    trigger:
      - platform: time
        at: "22:00:00"
      - platform: time
        at: "23:00:00"
  
    condition:
      - condition: template
        value_template: >
          {% set forecast_data = state_attr('sensor.solcast_pv_forecast_prognoza_na_jutro', 'detailedForecast') or [] %}
          {% set planned_date = state_attr('var.magazyn_plan_export_po_22', 'planned_date') | default('', true) %}
          {% set po22_enabled = (states('var.magazyn_plan_export_po_22') | int(0)) == 1
             or state_attr('var.magazyn_plan_export_po_22', 'enabled') in [true, 'True', 'true', 'on', 'ON'] %}
          {% set po22 = po22_enabled and planned_date == (now().date() | string) %}
          {% set h = now().hour %}
          {{ forecast_data | length > 0 and ((h == 22 and not po22) or (h == 23 and po22)) }}
  
    action:
      # Floor ustawiany o 05:29 wg pogody ma obowiązywać tylko bieżący poranek.
      # Nocny booking następnego dnia zawsze startuje od bazowych 25%.
      - service: var.set
        data:
          entity_id: var.magazyn_soc_min_rano_percent
          value: 25

      - variables:
          soc_teraz: "{{ states('sensor.solarman_battery_safe') | float(0) }}"
          tz_to: "{{ now().strftime('%z')[0:3] ~ ':' ~ now().strftime('%z')[3:5] }}"
          noc_booking_hour: "{{ now().hour }}"
          export_po22_delayed_booking: >
            {% set planned_date = state_attr('var.magazyn_plan_export_po_22', 'planned_date') | default('', true) %}
            {% set enabled = (states('var.magazyn_plan_export_po_22') | int(0)) == 1
               or state_attr('var.magazyn_plan_export_po_22', 'enabled') in [true, 'True', 'true', 'on', 'ON'] %}
            {{ enabled and planned_date == (now().date() | string) }}
  
          koszt_tansza: "{{ states('var.magazyn_koszt_calkowity_strefa_tansza_pln_kwh') | float(0) }}"
          koszt_drozsza: "{{ states('var.magazyn_koszt_calkowity_strefa_drozsza_pln_kwh') | float(0) }}"
          min_zysk_sprzedaz: "{{ states('var.magazyn_min_zysk_sprzedaz_pln_kwh') | float(0) }}"
          min_export_price_pv: 0.10
          partial_bat_min_price: >
            {{ (states('var.magazyn_koszt_calkowity_strefa_tansza_pln_kwh') | float(0))
               + (states('var.magazyn_min_zysk_sprzedaz_pln_kwh') | float(0)) }}
          full_bat_min_price: >
            {{ (states('var.magazyn_koszt_calkowity_strefa_drozsza_pln_kwh') | float(0))
               + (states('var.magazyn_min_zysk_sprzedaz_pln_kwh') | float(0)) }}
  
          pojemnosc_kwh: "{{ states('var.magazyn_pojemnosc_brutto_kwh') | float(15) }}"
          soc_floor_pct: "{{ states('var.magazyn_soc_floor_percent') | float(20) }}"
          soc_comfort_pct: "{{ states('var.magazyn_soc_comfort_percent') | float(25) }}"
          soc_min_rano_pct: "{{ states('var.magazyn_soc_min_rano_percent') | float(25) }}"
          soc_buffer_mid_pct: "{{ states('var.magazyn_soc_buffer_mid_percent') | float(5) }}"
          max_moc_rozladowania_kw: "{{ states('var.magazyn_max_moc_rozladowania_kw') | float(6) }}"

          cons_mult: "{{ states('var.magazyn_konsumpcja_multiplier') | float(1.15) }}"
          cons_default: "{{ states('var.magazyn_konsumpcja_default_kwh_h') | float(1.5) }}"
          urlop_kwh_h: "{{ states('var.magazyn_konsumpcja_urlop_kwh_h') | float(0.5) }}"
          sprzatanie_mult: "{{ states('var.magazyn_konsumpcja_mult_sprzatanie') | float(2.0) }}"
          lookback_sec: "{{ (states('var.magazyn_sql_lookback_days_ladowanie') | int(7)) * 86400 }}"
          zapas_kwh: "{{ states('var.magazyn_zapas_kwh') | float(0.75) }}"

          ceny_jutro: "{{ state_attr('sensor.rce_prices_tomorrow_scaled', 'value') or [] }}"
  
      - service: sql.query
        data:
          query: >
            /* TEMP EMS1 2026-06-30: statyczna baza zuzycia z dni 2026-06-19..26 */
            SELECT slot, avg_h
            FROM (
              SELECT 0 AS slot, 0.450 AS avg_h
              UNION ALL SELECT 1 AS slot, 0.475 AS avg_h
              UNION ALL SELECT 2 AS slot, 0.488 AS avg_h
              UNION ALL SELECT 3 AS slot, 0.400 AS avg_h
              UNION ALL SELECT 4 AS slot, 0.338 AS avg_h
              UNION ALL SELECT 5 AS slot, 0.338 AS avg_h
              UNION ALL SELECT 6 AS slot, 0.350 AS avg_h
              UNION ALL SELECT 7 AS slot, 0.275 AS avg_h
              UNION ALL SELECT 8 AS slot, 0.263 AS avg_h
              UNION ALL SELECT 9 AS slot, 0.325 AS avg_h
              UNION ALL SELECT 10 AS slot, 0.300 AS avg_h
              UNION ALL SELECT 11 AS slot, 0.313 AS avg_h
              UNION ALL SELECT 12 AS slot, 0.288 AS avg_h
              UNION ALL SELECT 13 AS slot, 0.263 AS avg_h
              UNION ALL SELECT 14 AS slot, 0.350 AS avg_h
              UNION ALL SELECT 15 AS slot, 0.450 AS avg_h
              UNION ALL SELECT 16 AS slot, 0.538 AS avg_h
              UNION ALL SELECT 17 AS slot, 0.800 AS avg_h
              UNION ALL SELECT 18 AS slot, 0.850 AS avg_h
              UNION ALL SELECT 19 AS slot, 0.950 AS avg_h
              UNION ALL SELECT 20 AS slot, 0.988 AS avg_h
              UNION ALL SELECT 21 AS slot, 0.925 AS avg_h
              UNION ALL SELECT 22 AS slot, 0.913 AS avg_h
              UNION ALL SELECT 23 AS slot, 1.038 AS avg_h
              UNION ALL SELECT 24 AS slot, 0.975 AS avg_h
              UNION ALL SELECT 25 AS slot, 0.888 AS avg_h
              UNION ALL SELECT 26 AS slot, 0.775 AS avg_h
              UNION ALL SELECT 27 AS slot, 1.038 AS avg_h
              UNION ALL SELECT 28 AS slot, 1.300 AS avg_h
              UNION ALL SELECT 29 AS slot, 1.100 AS avg_h
              UNION ALL SELECT 30 AS slot, 0.825 AS avg_h
              UNION ALL SELECT 31 AS slot, 0.775 AS avg_h
              UNION ALL SELECT 32 AS slot, 0.663 AS avg_h
              UNION ALL SELECT 33 AS slot, 0.913 AS avg_h
              UNION ALL SELECT 34 AS slot, 0.800 AS avg_h
              UNION ALL SELECT 35 AS slot, 0.863 AS avg_h
              UNION ALL SELECT 36 AS slot, 0.850 AS avg_h
              UNION ALL SELECT 37 AS slot, 0.925 AS avg_h
              UNION ALL SELECT 38 AS slot, 1.125 AS avg_h
              UNION ALL SELECT 39 AS slot, 0.963 AS avg_h
              UNION ALL SELECT 40 AS slot, 1.000 AS avg_h
              UNION ALL SELECT 41 AS slot, 0.963 AS avg_h
              UNION ALL SELECT 42 AS slot, 0.975 AS avg_h
              UNION ALL SELECT 43 AS slot, 0.688 AS avg_h
              UNION ALL SELECT 44 AS slot, 0.538 AS avg_h
              UNION ALL SELECT 45 AS slot, 0.388 AS avg_h
              UNION ALL SELECT 46 AS slot, 0.500 AS avg_h
              UNION ALL SELECT 47 AS slot, 0.550 AS avg_h
            ) static_usage
            WHERE slot BETWEEN 6 AND 43
            ORDER BY slot;
        response_variable: statystyki_rano

      - service: calendar.get_events
        target:
          entity_id: calendar.urlop
        data:
          start_date_time: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d 00:00:00') }}"
          end_date_time: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d 23:59:59') }}"
        response_variable: urlop_events

      - service: calendar.get_events
        target:
          entity_id: calendar.sprzatanie
        data:
          start_date_time: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d 00:00:00') }}"
          end_date_time: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d 23:59:59') }}"
        response_variable: sprzatanie_events

      - variables:
          pack: >-
            {% set forecast_data = state_attr('sensor.solcast_pv_forecast_prognoza_na_jutro', 'detailedForecast') or [] %}

            {# ===== URLOP: lista slotów (YYYY-MM-DD HH:MM) dla JUTRZEJSZEGO planu ===== #}
            {% set urlop_list = (urlop_events['calendar.urlop'].events if (urlop_events and 'calendar.urlop' in urlop_events) else []) %}
            {% set urlop_ns = namespace(hours=[]) %}
            {% for ev in urlop_list %}
              {% set es = as_datetime(ev.start) | as_local %}
              {% set ee = as_datetime(ev.end) | as_local %}
              {% for off in range(0, 48) %}
                {% set probe = (now() + timedelta(days=1)).replace(hour=0, minute=0, second=0, microsecond=0) + timedelta(minutes=off*30) %}
                {% if probe >= es and probe < ee %}
                  {% set hk = probe.strftime('%Y-%m-%d %H:%M') %}
                  {% if hk not in urlop_ns.hours %}
                    {% set urlop_ns.hours = urlop_ns.hours + [hk] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {% set urlop_hours = urlop_ns.hours %}
            {% set urlop_any = (urlop_hours | length) > 0 %}

            {# ===== SPRZATANIE: lista slotów (YYYY-MM-DD HH:MM) dla JUTRZEJSZEGO planu ===== #}
            {% set sprzatanie_list = (sprzatanie_events['calendar.sprzatanie'].events if (sprzatanie_events and 'calendar.sprzatanie' in sprzatanie_events) else []) %}
            {% set sprzatanie_ns = namespace(hours=[]) %}
            {% for ev in sprzatanie_list %}
              {% set es = as_datetime(ev.start) | as_local %}
              {% set ee = as_datetime(ev.end) | as_local %}
              {% for off in range(0, 48) %}
                {% set probe = (now() + timedelta(days=1)).replace(hour=0, minute=0, second=0, microsecond=0) + timedelta(minutes=off*30) %}
                {% if probe >= es and probe < ee %}
                  {% set hk = probe.strftime('%Y-%m-%d %H:%M') %}
                  {% if hk not in sprzatanie_ns.hours %}
                    {% set sprzatanie_ns.hours = sprzatanie_ns.hours + [hk] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {% set sprzatanie_hours = sprzatanie_ns.hours %}
            {% set sprzatanie_any = (sprzatanie_hours | length) > 0 %}

            {# --- zużycie dict --- #}
            {% set rows = statystyki_rano['result'] if (statystyki_rano is mapping and 'result' in statystyki_rano) else [] %}
            {% set nsC = namespace(d={}) %}
            {% for row in rows %}
              {% set nsC.d = nsC.d | combine({ (row['slot']|int): (row['avg_h']|float(0)) }) %}
            {% endfor %}
            {% set dict_z = nsC.d %}

            {# --- zmienne slotowe --- #}
            {% set cons_default_slot = cons_default | float(1.5) / 2 %}
            {% set urlop_kwh_slot = urlop_kwh_h | float(0.5) / 2 %}

            {# --- PV dict jutro: słownik slot→kWh (sloty 30-min) --- #}
            {% set jutro = (now() + timedelta(days=1)).date() %}
            {% set plan_date = jutro %}
            {% set nsP = namespace(d={}, count=0, debug='') %}
            {% set nsP.debug = "jutro:" ~ jutro ~ "|len:" ~ (forecast_data | length if forecast_data else 0) %}

            {% if forecast_data is iterable and forecast_data is not string and forecast_data | length > 0 %}
              {% for item in forecast_data %}
                {% if item is mapping %}
                  {% set ts = as_local(as_datetime(item.period_start or item.datetime)) %}
                  {% if ts.date() == jutro %}
                    {% set s_it = ts.hour * 2 + (ts.minute // 30) %}
                    {% set pv_value = (item.get('pv_estimate') or item.get('pv_forecast') or 0) | float(0) / 2 %}
                    {% set nsP.d = nsP.d | combine({ s_it: pv_value }) %}
                    {% set nsP.count = nsP.count + 1 %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% else %}
              {% set nsP.debug = nsP.debug ~ "|EMPTY_OR_STRING" %}
            {% endif %}

            {% set pv_d = nsP.d %}
            {% set pv_debug = "parsed:" ~ nsP.count ~ "|" ~ nsP.debug ~ "|pv_d:" ~ pv_d %}

            {# --- koniec produkcji PV wg prognozy (spill liczony do pv_end_slot_excl, fallback slot 28=14:00) --- #}
            {% set nsE = namespace(last=27) %}
            {% for s in range(0, 48) %}
              {% if pv_d.get(s, 0) > 0.1 %}{% set nsE.last = s %}{% endif %}
            {% endfor %}
            {% set pv_end_slot_excl = nsE.last + 1 %}
            {% if pv_end_slot_excl < 28 %}{% set pv_end_slot_excl = 28 %}{% endif %}
  
            {# --- rezerwa komfortowa --- #}
            {% set floor_kwh = (pojemnosc_kwh * soc_floor_pct / 100) %}
            {% set comfort_kwh = (pojemnosc_kwh * soc_comfort_pct / 100) %}
            {% set reserve_kwh = comfort_kwh - floor_kwh %}
            {% if reserve_kwh < 0 %}{% set reserve_kwh = 0 %}{% endif %}
  
            {# --- jutrzejsze min SOC do 13:00 --- #}
            {% set ns_cons = namespace(total=0.0) %}
            {% for s in range(12, 28) %}
              {% set hk = plan_date.strftime('%Y-%m-%d') ~ ' ' ~ '%02d:%02d'|format(s // 2, (s % 2) * 30) %}
              {% set is_urlop_h = hk in urlop_hours %}
              {% set is_sprzatanie_h = hk in sprzatanie_hours %}
              {% set z_h = (dict_z.get(s, cons_default_slot)) * sprzatanie_mult if is_sprzatanie_h else (urlop_kwh_slot if is_urlop_h else (dict_z.get(s, cons_default_slot)) * cons_mult) %}
              {% set ns_cons.total = ns_cons.total + z_h %}
            {% endfor %}
            {% set total_cons_6_13 = ns_cons.total %}

            {% set ns_pv_sum = namespace(total=0.0) %}
            {% for s in range(12, 28) %}
              {% set pv_h = pv_d.get(s, 0) %}
              {% set ns_pv_sum.total = ns_pv_sum.total + pv_h %}
            {% endfor %}
            {% set total_pv_sum_6_13 = ns_pv_sum.total %}
  
            {% set energia_z_baterii_do_13 = total_cons_6_13 - total_pv_sum_6_13 %}
            {% if energia_z_baterii_do_13 < 0 %}{% set energia_z_baterii_do_13 = 0 %}{% endif %}
  
            {% set E_min_partial = energia_z_baterii_do_13 + reserve_kwh %}
            {% set soc_min_dynamic_13_tomorrow = ((E_min_partial + floor_kwh) / pojemnosc_kwh * 100) | round(0) | int %}
            {% if soc_min_dynamic_13_tomorrow < (soc_floor_pct | int(20)) %}{% set soc_min_dynamic_13_tomorrow = soc_floor_pct | int(20) %}{% endif %}
            {% if soc_min_dynamic_13_tomorrow > 100 %}{% set soc_min_dynamic_13_tomorrow = 100 %}{% endif %}
  
            {% set soc_mid_stop_tomorrow = soc_min_dynamic_13_tomorrow + soc_buffer_mid_pct %}
            {% if soc_mid_stop_tomorrow > 100 %}{% set soc_mid_stop_tomorrow = 100 %}{% endif %}
  
            {# --- prawdziwy spill od bieżącego SOC: overflow magazynu >100% --- #}
            {% set nsSpill = namespace(
              will=false,
              start_s=28,
              lines='',
              batt_kwh=((soc_teraz / 100) * pojemnosc_kwh)
            ) %}

            {% for s in range(12, pv_end_slot_excl) %}
              {% set pv_h = pv_d.get(s, 0) %}
              {% set hk = plan_date.strftime('%Y-%m-%d') ~ ' ' ~ '%02d:%02d'|format(s // 2, (s % 2) * 30) %}
              {% set is_urlop_h = hk in urlop_hours %}
              {% set is_sprzatanie_h = hk in sprzatanie_hours %}
              {% set z_h = (dict_z.get(s, cons_default_slot)) * sprzatanie_mult if is_sprzatanie_h else (urlop_kwh_slot if is_urlop_h else (dict_z.get(s, cons_default_slot)) * cons_mult) %}
              {% set net_h = pv_h - z_h %}
              {% set batt_before = nsSpill.batt_kwh %}
              {% set batt_after_raw = batt_before + net_h %}

              {% if batt_after_raw > pojemnosc_kwh %}
                {% set spill_h = batt_after_raw - pojemnosc_kwh %}
                {% if not nsSpill.will %}
                  {% set nsSpill.will = true %}
                  {% set nsSpill.start_s = s %}
                {% endif %}
                {% set nsSpill.lines = nsSpill.lines ~
                  "\n- s" ~ s ~ "(" ~ ('%02d:%02d'|format(s//2,(s%2)*30)) ~ ")" ~
                  " | batt_before:" ~ (batt_before|round(2)) ~
                  " | pv:" ~ (pv_h|round(2)) ~
                  " | cons:" ~ (z_h|round(2)) ~
                  " | batt_after_raw:" ~ (batt_after_raw|round(2)) ~
                  " | spill:" ~ (spill_h|round(2))
                %}
                {% set nsSpill.batt_kwh = pojemnosc_kwh %}
              {% elif batt_after_raw < 0 %}
                {% set nsSpill.batt_kwh = 0 %}
              {% else %}
                {% set nsSpill.batt_kwh = batt_after_raw %}
              {% endif %}
            {% endfor %}
            {% set will_spill = nsSpill.will %}
            {% set spill_start_slot = nsSpill.start_s %}
  
            {# --- energia potrzebna by przetrwać od 06:00 do spill_start_slot lub do 14:00 (slot 28) --- #}
            {% set survive_to_slot = spill_start_slot if will_spill else 28 %}
            {% set nsSurvive = namespace(total=0.0, lines='') %}
            {% for s in range(12, survive_to_slot) %}
              {% set pv_h = pv_d.get(s, 0) %}
              {% set hk = plan_date.strftime('%Y-%m-%d') ~ ' ' ~ '%02d:%02d'|format(s // 2, (s % 2) * 30) %}
              {% set is_urlop_h = hk in urlop_hours %}
              {% set is_sprzatanie_h = hk in sprzatanie_hours %}
              {% set z_h = (dict_z.get(s, cons_default_slot)) * sprzatanie_mult if is_sprzatanie_h else (urlop_kwh_slot if is_urlop_h else (dict_z.get(s, cons_default_slot)) * cons_mult) %}
              {% set batt_h = z_h - pv_h %}
              {% if batt_h < 0 %}{% set batt_h = 0 %}{% endif %}
              {% set nsSurvive.total = nsSurvive.total + batt_h %}
              {% set nsSurvive.lines = nsSurvive.lines ~
                "\n- s" ~ s ~ "(" ~ ('%02d:%02d'|format(s//2,(s%2)*30)) ~ ")" ~
                " | cons:" ~ (z_h|round(2)) ~
                " | pv:" ~ (pv_h|round(2)) ~
                " | batt:" ~ (batt_h|round(2))
              %}
            {% endfor %}
            {% set survival_energy = nsSurvive.total %}
  
            {# --- realny budżet baterii na jutro rano: tylko z obecnego SOC --- #}
            {% set energy_now_kwh = (soc_teraz / 100) * pojemnosc_kwh %}
            {% set energy_min_high_kwh = (soc_min_dynamic_13_tomorrow / 100) * pojemnosc_kwh %}
            {% set battery_budget_high = energy_now_kwh - energy_min_high_kwh %}
            {% if battery_budget_high < 0 %}{% set battery_budget_high = 0 %}{% endif %}
  
            {% set battery_slot_cap_kwh = max_moc_rozladowania_kw * 0.25 %}
            {% if battery_slot_cap_kwh < 0 %}{% set battery_slot_cap_kwh = 0 %}{% endif %}
  
            {# --- kandydaci FULL / PARTIAL rano, sortowane po cenie --- #}
            {% set nsFullCand = namespace(list=[]) %}
            {% set nsPartCand = namespace(list=[]) %}
  
            {% for c in ceny_jutro %}
              {% if c is mapping and c.period is defined %}
                {% set p = (c.period | string).replace('–','-') %}
                {% set p2 = p.replace(' ', '') %}
                {% if '-' in p2 %}
                  {% set parts = p2.split('-') %}
                  {% set start = parts[0] %}
                  {% set hm = start.split(':') %}
                  {% if hm|length == 2 %}
                    {% set h = hm[0]|int %}
                    {% set price_mwh = c.rce_pln | float(0) %}
                    {% set price_kwh = price_mwh / 1000 %}
  
                    {% if h >= 6 and h < 13 %}
                      {% set pv_h = pv_d.get(h*2, 0) + pv_d.get(h*2+1, 0) %}
                      {% set hk0 = plan_date.strftime('%Y-%m-%d') ~ ' ' ~ '%02d:00'|format(h) %}
                      {% set hk1 = plan_date.strftime('%Y-%m-%d') ~ ' ' ~ '%02d:30'|format(h) %}
              {% set is_urlop_h = hk0 in urlop_hours or hk1 in urlop_hours %}
              {% set is_sprzatanie_h = hk0 in sprzatanie_hours or hk1 in sprzatanie_hours %}
              {% set z_h0 = (dict_z.get(h*2, cons_default_slot)) * sprzatanie_mult if is_sprzatanie_h else (urlop_kwh_slot if is_urlop_h else (dict_z.get(h*2, cons_default_slot)) * cons_mult) %}
              {% set z_h1 = (dict_z.get(h*2+1, cons_default_slot)) * sprzatanie_mult if is_sprzatanie_h else (urlop_kwh_slot if is_urlop_h else (dict_z.get(h*2+1, cons_default_slot)) * cons_mult) %}
              {% set z_h = z_h0 + z_h1 %}
                      {% set pv_slot_energy = (pv_h - z_h) / 4 %}
                      {% if pv_slot_energy < 0 %}{% set pv_slot_energy = 0 %}{% endif %}
  
                      {% if price_kwh >= full_bat_min_price %}
                        {% set nsFullCand.list = nsFullCand.list + [{
                          'period': c.period,
                          'h': h,
                          'price_mwh': price_mwh,
                          'price_kwh': price_kwh,
                          'pv_slot_energy': pv_slot_energy,
                          'bat_cap': battery_slot_cap_kwh,
                          'mode': 'full'
                        }] %}
                      {% elif price_kwh >= partial_bat_min_price %}
                        {% set nsPartCand.list = nsPartCand.list + [{
                          'period': c.period,
                          'h': h,
                          'price_mwh': price_mwh,
                          'price_kwh': price_kwh,
                          'pv_slot_energy': pv_slot_energy,
                          'bat_cap': battery_slot_cap_kwh,
                          'mode': 'partial'
                        }] %}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
  
            {% set full_sorted = nsFullCand.list | sort(attribute='price_kwh', reverse=true) %}
            {% set part_sorted = nsPartCand.list | sort(attribute='price_kwh', reverse=true) %}
  
            {# --- najpierw FULL --- #}
            {% set nsFull = namespace(rem=battery_budget_high, count=0, export_energy=0.0, lines='') %}
            {% for s in full_sorted %}
              {% if nsFull.rem > 0.001 %}
                {% set slot_bat = [s.bat_cap, nsFull.rem] | min %}
                {% if slot_bat < 0 %}{% set slot_bat = 0 %}{% endif %}
                {% if slot_bat > 0 %}
                  {% set nsFull.count = nsFull.count + 1 %}
                  {% set nsFull.export_energy = nsFull.export_energy + slot_bat %}
                  {% set nsFull.rem = nsFull.rem - slot_bat %}
                  {% set nsFull.lines = nsFull.lines ~
                    "\n- " ~ s.period ~
                    " | FULL | " ~ (s.price_mwh|round(1)) ~ " PLN/MWh" ~
                    " | pv:" ~ (s.pv_slot_energy|round(3)) ~ " kWh" ~
                    " | bat:" ~ (slot_bat|round(3)) ~ " kWh"
                  %}
                {% endif %}
              {% endif %}
            {% endfor %}
  
            {# --- potem PARTIAL z reszty budżetu --- #}
            {% set nsPart = namespace(rem=nsFull.rem, count=0, export_energy=0.0, lines='') %}
            {% for s in part_sorted %}
              {% if nsPart.rem > 0.001 %}
                {% set slot_bat = [s.bat_cap, nsPart.rem] | min %}
                {% if slot_bat < 0 %}{% set slot_bat = 0 %}{% endif %}
                {% if slot_bat > 0 %}
                  {% set nsPart.count = nsPart.count + 1 %}
                  {% set nsPart.export_energy = nsPart.export_energy + slot_bat %}
                  {% set nsPart.rem = nsPart.rem - slot_bat %}
                  {% set nsPart.lines = nsPart.lines ~
                    "\n- " ~ s.period ~
                    " | PARTIAL | " ~ (s.price_mwh|round(1)) ~ " PLN/MWh" ~
                    " | pv:" ~ (s.pv_slot_energy|round(3)) ~ " kWh" ~
                    " | bat:" ~ (slot_bat|round(3)) ~ " kWh"
                  %}
                {% endif %}
              {% endif %}
            {% endfor %}
  
            {% set good_slot_count = nsFull.count + nsPart.count %}
            {% set has_good_price_slots = (good_slot_count > 0) %}
            {% set export_energy_needed = nsFull.export_energy + nsPart.export_energy %}
            {% set good_lines = nsFull.lines ~ nsPart.lines %}
  
            {# --- finalna logika bookingu --- #}
            {% if not will_spill %}
              {% set booked_energy = survival_energy + reserve_kwh %}
              {% set mode = 'no_spill_survival_only' %}
            {% else %}
              {% if has_good_price_slots %}
                {% set booked_energy = survival_energy + export_energy_needed + reserve_kwh %}
                {% set mode = 'spill_good_prices_export_plus_survival' %}
              {% else %}
                {% set booked_energy = survival_energy + reserve_kwh %}
                {% set mode = 'spill_no_good_prices_survival_only' %}
              {% endif %}
            {% endif %}
  
            {% set booked_soc = ((booked_energy + floor_kwh) / pojemnosc_kwh * 100) | round(0) | int %}
            {% if booked_soc < (soc_floor_pct | int(20)) %}{% set booked_soc = soc_floor_pct | int(20) %}{% endif %}
            {% if booked_soc < (soc_min_rano_pct | int(25)) %}{% set booked_soc = soc_min_rano_pct | int(25) %}{% endif %}
            {% if booked_soc > 100 %}{% set booked_soc = 100 %}{% endif %}
  
            {# Preview planera 02:00 dla jutrzejszego poranka. #}
            {% set prog_min_kwh = pojemnosc_kwh * soc_floor_pct / 100 %}
            {% set max_ene_u = pojemnosc_kwh - prog_min_kwh %}
            {% set E0_u = ((soc_teraz / 100) * pojemnosc_kwh - prog_min_kwh) %}
            {% if E0_u < 0 %}{% set E0_u = 0 %}{% endif %}
            {% if E0_u > max_ene_u %}{% set E0_u = max_ene_u %}{% endif %}

            {% set target_soc_13 = states('var.cel_naladowania_o_13') | float(50) %}
            {% if target_soc_13 < 25 %}{% set target_soc_13 = 25 %}{% endif %}
            {% if target_soc_13 > 100 %}{% set target_soc_13 = 100 %}{% endif %}
            {% set target_u_13 = ((target_soc_13 / 100) * pojemnosc_kwh - prog_min_kwh) %}
            {% if target_u_13 < 0 %}{% set target_u_13 = 0 %}{% endif %}
            {% if target_u_13 > max_ene_u %}{% set target_u_13 = max_ene_u %}{% endif %}

            {% set afternoon_charge_cap_u = states('var.magazyn_ladowanie_13_15_capacity_kwh') | float(14) %}
            {% if afternoon_charge_cap_u < 0 %}{% set afternoon_charge_cap_u = 0 %}{% endif %}
            {% if afternoon_charge_cap_u > max_ene_u %}{% set afternoon_charge_cap_u = max_ene_u %}{% endif %}
            {% set afternoon_precheck_soc_cap_pct = states('var.magazyn_soc_cap_precheck_popoludnie_percent') | float(90) %}
            {% if afternoon_precheck_soc_cap_pct < 25 %}{% set afternoon_precheck_soc_cap_pct = 25 %}{% endif %}
            {% if afternoon_precheck_soc_cap_pct > 100 %}{% set afternoon_precheck_soc_cap_pct = 100 %}{% endif %}
            {% set afternoon_precheck_cap_u = ((afternoon_precheck_soc_cap_pct / 100) * pojemnosc_kwh - prog_min_kwh) %}
            {% if afternoon_precheck_cap_u < 0 %}{% set afternoon_precheck_cap_u = 0 %}{% endif %}
            {% if afternoon_precheck_cap_u > max_ene_u %}{% set afternoon_precheck_cap_u = max_ene_u %}{% endif %}

            {% set nsR = namespace(S_post=0.0, S_post_13=0.0, Smin_post=0.0, Smin_post_do_11=0.0, Smax_post=0.0) %}
            {% for s in range(12, pv_end_slot_excl) %}
              {% set hk = plan_date.strftime('%Y-%m-%d') ~ ' ' ~ '%02d:%02d'|format(s // 2, (s % 2) * 30) %}
              {% set is_urlop_h = hk in urlop_hours %}
              {% set is_sprzatanie_h = hk in sprzatanie_hours %}
              {% set z_s = (dict_z.get(s, cons_default_slot)) * sprzatanie_mult if is_sprzatanie_h else (urlop_kwh_slot if is_urlop_h else (dict_z.get(s, cons_default_slot)) * cons_mult) %}
              {% set delta = pv_d.get(s, 0) - z_s %}
              {% set nsR.S_post = nsR.S_post + delta %}
              {% if nsR.S_post < nsR.Smin_post %}{% set nsR.Smin_post = nsR.S_post %}{% endif %}
              {% if s <= 21 and nsR.S_post < nsR.Smin_post_do_11 %}{% set nsR.Smin_post_do_11 = nsR.S_post %}{% endif %}
              {% if nsR.S_post > nsR.Smax_post %}{% set nsR.Smax_post = nsR.S_post %}{% endif %}
              {% if s == 25 %}{% set nsR.S_post_13 = nsR.S_post %}{% endif %}
            {% endfor %}

            {% set nsA = namespace(S_13_15=0.0, S_15_22=0.0, Smin_15_22=0.0, cons_15_22=0.0, pv_15_22=0.0) %}
            {% for s in range(26, 44) %}
              {% set hk = plan_date.strftime('%Y-%m-%d') ~ ' ' ~ '%02d:%02d'|format(s // 2, (s % 2) * 30) %}
              {% set is_urlop_h = hk in urlop_hours %}
              {% set is_sprzatanie_h = hk in sprzatanie_hours %}
              {% set z_s = (dict_z.get(s, cons_default_slot)) * sprzatanie_mult if is_sprzatanie_h else (urlop_kwh_slot if is_urlop_h else (dict_z.get(s, cons_default_slot)) * cons_mult) %}
              {% set pv_s = pv_d.get(s, 0) %}
              {% set delta = pv_s - z_s %}
              {% if s < 30 %}
                {% set nsA.S_13_15 = nsA.S_13_15 + delta %}
              {% else %}
                {% set nsA.S_15_22 = nsA.S_15_22 + delta %}
                {% if nsA.S_15_22 < nsA.Smin_15_22 %}{% set nsA.Smin_15_22 = nsA.S_15_22 %}{% endif %}
                {% set nsA.cons_15_22 = nsA.cons_15_22 + z_s %}
                {% set nsA.pv_15_22 = nsA.pv_15_22 + pv_s %}
              {% endif %}
            {% endfor %}

            {% set E15_req_survival = zapas_kwh - nsA.Smin_15_22 %}
            {% if E15_req_survival < 0 %}{% set E15_req_survival = 0 %}{% endif %}
            {% if E15_req_survival > max_ene_u %}{% set E15_req_survival = max_ene_u %}{% endif %}
            {% set afternoon_export_required_u = 0.0 %}
            {% if is_state('input_boolean.magazyn_doladowanie_pod_eksport_wieczor', 'on') %}
              {% set prog_czesciowy = (koszt_tansza | float(0)) + (min_zysk_sprzedaz | float(0)) %}
              {% set battery_slot_u_full = max_moc_rozladowania_kw * 0.25 %}
              {% if battery_slot_u_full < 0 %}{% set battery_slot_u_full = 0 %}{% endif %}
              {% set E_reserve_u_evening = (pojemnosc_kwh * soc_comfort_pct / 100) - prog_min_kwh %}
              {% if E_reserve_u_evening < 0 %}{% set E_reserve_u_evening = 0 %}{% endif %}
              {% if E_reserve_u_evening > max_ene_u %}{% set E_reserve_u_evening = max_ene_u %}{% endif %}
              {% set energia_dom_z_baterii_15_22 = nsA.cons_15_22 - nsA.pv_15_22 %}
              {% if energia_dom_z_baterii_15_22 < 0 %}{% set energia_dom_z_baterii_15_22 = 0 %}{% endif %}
              {% set nsExp = namespace(slots=0) %}
              {% for c in ceny_jutro %}
                {% if c is mapping and c.period is defined %}
                  {% set p2 = (c.period | string).replace('–', '-').replace(' ', '') %}
                  {% if '-' in p2 %}
                    {% set hm = p2.split('-')[0].split(':') %}
                    {% if hm | length == 2 %}
                      {% set h = hm[0] | int %}
                      {% set price_kwh = (c.rce_pln | float(0)) / 1000 %}
                      {% if h >= 15 and h < 22 and price_kwh >= prog_czesciowy %}
                        {% set nsExp.slots = nsExp.slots + 1 %}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% set afternoon_export_required_u = energia_dom_z_baterii_15_22 + E_reserve_u_evening + (nsExp.slots * battery_slot_u_full) %}
              {% if afternoon_export_required_u > max_ene_u %}{% set afternoon_export_required_u = max_ene_u %}{% endif %}
            {% endif %}
            {% set E15_required_afternoon = [E15_req_survival, afternoon_export_required_u] | max %}
            {% set E13_required_afternoon = E15_required_afternoon - afternoon_charge_cap_u - nsA.S_13_15 %}
            {% if E13_required_afternoon < 0 %}{% set E13_required_afternoon = 0 %}{% endif %}
            {% if E13_required_afternoon > max_ene_u %}{% set E13_required_afternoon = max_ene_u %}{% endif %}
            {% set E6_req_afternoon = E13_required_afternoon - nsR.S_post_13 %}
            {% if E6_req_afternoon < 0 %}{% set E6_req_afternoon = 0 %}{% endif %}
            {% if E6_req_afternoon > max_ene_u %}{% set E6_req_afternoon = max_ene_u %}{% endif %}
            {% set E6_req_afternoon_raw = E6_req_afternoon %}

            {% set E6_base = E0_u %}
            {% set E6_req_floor = zapas_kwh - nsR.Smin_post %}
            {% if E6_req_floor < 0 %}{% set E6_req_floor = 0 %}{% endif %}
            {% if E6_req_floor > max_ene_u %}{% set E6_req_floor = max_ene_u %}{% endif %}
            {% set rano_min_u = ((soc_min_rano_pct / 100) * pojemnosc_kwh - prog_min_kwh) %}
            {% if rano_min_u < 0 %}{% set rano_min_u = 0 %}{% endif %}
            {% set E6_req_floor_rano = rano_min_u - nsR.Smin_post_do_11 %}
            {% if E6_req_floor_rano < 0 %}{% set E6_req_floor_rano = 0 %}{% endif %}
            {% if E6_req_floor_rano > max_ene_u %}{% set E6_req_floor_rano = max_ene_u %}{% endif %}
            {% set E6_req_target = target_u_13 - nsR.S_post_13 %}
            {% if E6_req_target < 0 %}{% set E6_req_target = 0 %}{% endif %}
            {% if E6_req_target > max_ene_u %}{% set E6_req_target = max_ene_u %}{% endif %}
            {% set E6_safe_max = max_ene_u - nsR.Smax_post %}
            {% if E6_safe_max < 0 %}{% set E6_safe_max = 0 %}{% endif %}
            {% if E6_safe_max > max_ene_u %}{% set E6_safe_max = max_ene_u %}{% endif %}
            {% set E6_afternoon_cap_max = afternoon_precheck_cap_u - nsR.Smax_post %}
            {% if E6_afternoon_cap_max < 0 %}{% set E6_afternoon_cap_max = 0 %}{% endif %}
            {% if E6_afternoon_cap_max > max_ene_u %}{% set E6_afternoon_cap_max = max_ene_u %}{% endif %}
            {% set E6_req_afternoon = [E6_req_afternoon, [E6_safe_max, E6_afternoon_cap_max] | min] | min %}
            {% if E6_req_afternoon < 0 %}{% set E6_req_afternoon = 0 %}{% endif %}

            {% set E6_plan_required = [E6_req_floor, E6_req_floor_rano, E6_req_target, E6_req_afternoon] | max %}
            {% set E6_plan_soft_required = [E6_req_floor, E6_req_target, E6_req_afternoon] | max %}
            {% set E6_plan_soft = [E6_plan_soft_required, E6_safe_max] | min %}
            {% set E6_plan = [E6_plan_soft, E6_req_floor_rano] | max %}
            {% if E6_plan < 0 %}{% set E6_plan = 0 %}{% endif %}
            {% if E6_plan > max_ene_u %}{% set E6_plan = max_ene_u %}{% endif %}
            {% set grid_add_u = [E6_plan - E6_base, 0] | max %}
            {% set grid_add_u = [grid_add_u, (max_ene_u - E6_base)] | min %}
            {% if grid_add_u < 0 %}{% set grid_add_u = 0 %}{% endif %}
            {% set rano_czy_ladowac = (grid_add_u | round(2)) >= 0.01 %}
            {% set E_start_u_new = E6_base + grid_add_u %}
            {% set rano_cel = (((E_start_u_new + prog_min_kwh) / pojemnosc_kwh) * 100) | int %}
            {% if rano_cel < 25 %}{% set rano_cel = 25 %}{% endif %}
            {% if rano_cel > 100 %}{% set rano_cel = 100 %}{% endif %}
            {% set rano_powod = 'TARGET13' %}

            {% set pv_tomorrow_kwh = states('sensor.solcast_pv_forecast_prognoza_na_jutro') | float(0) %}
            {% set lowpv_threshold_rano = states('var.magazyn_lowpv_threshold_rano_kwh') | float(8.0) %}
            {% set force_full = (pv_tomorrow_kwh > 0 and pv_tomorrow_kwh < lowpv_threshold_rano) %}
            {% if force_full and not urlop_any %}
              {% set rano_cel = 100 %}
              {% set rano_czy_ladowac = true %}
              {% set rano_powod = 'LOWPV' %}
            {% endif %}

            {% if urlop_any %}
              {% set urlop_target_u = E6_plan + 1.0 %}
              {% if urlop_target_u > max_ene_u %}{% set urlop_target_u = max_ene_u %}{% endif %}
              {% set urlop_cap_u = [E6_safe_max, E6_req_floor_rano] | max %}
              {% if urlop_cap_u > max_ene_u %}{% set urlop_cap_u = max_ene_u %}{% endif %}
              {% if urlop_target_u > urlop_cap_u %}{% set urlop_target_u = urlop_cap_u %}{% endif %}
              {% if urlop_target_u < E6_req_floor_rano %}{% set urlop_target_u = E6_req_floor_rano %}{% endif %}
              {% set grid_add_u = [urlop_target_u - E6_base, 0] | max %}
              {% set E_start_u_new = E6_base + grid_add_u %}
              {% set rano_cel = (((E_start_u_new + prog_min_kwh) / pojemnosc_kwh) * 100) | int %}
              {% if rano_cel < 25 %}{% set rano_cel = 25 %}{% endif %}
              {% if rano_cel > 100 %}{% set rano_cel = 100 %}{% endif %}
              {% set rano_czy_ladowac = (grid_add_u | round(2)) >= 0.01 %}
              {% set rano_powod = rano_powod ~ '+URLOP' %}
            {% endif %}

            {% set morning_export_reason = 'FEATURE_OFF' %}
            {% set morning_export_extra_u = 0.0 %}
            {% if is_state('input_boolean.magazyn_doladowanie_pod_eksport_poranek', 'on') and rano_cel < 100 %}
              {% set semi_bat_min_price = (koszt_tansza | float(0)) + (min_zysk_sprzedaz | float(0)) %}
              {% set full_bat_min_price_preview = (koszt_drozsza | float(0)) + (min_zysk_sprzedaz | float(0)) %}
              {% set battery_slot_cap_kwh = max_moc_rozladowania_kw * 0.25 %}
              {% set export_floor_pct = [30, target_soc_13] | max %}
              {% set export_floor_kwh_abs = pojemnosc_kwh * export_floor_pct / 100 %}
              {% set E6_after_base = E6_base + grid_add_u %}
              {% if E6_after_base < 0 %}{% set E6_after_base = 0 %}{% endif %}
              {% if E6_after_base > max_ene_u %}{% set E6_after_base = max_ene_u %}{% endif %}
              {% set current_export_budget_u = (E6_after_base + prog_min_kwh) - export_floor_kwh_abs %}
              {% if current_export_budget_u < 0 %}{% set current_export_budget_u = 0 %}{% endif %}
              {% set max_export_budget_u = pojemnosc_kwh - export_floor_kwh_abs %}
              {% if max_export_budget_u < 0 %}{% set max_export_budget_u = 0 %}{% endif %}
              {% set nsMorning = namespace(full=0.0, semi=0.0, rem_full=max_export_budget_u, rem_semi=0.0, full_cand=[], semi_cand=[]) %}
              {% for c in ceny_jutro %}
                {% if c is mapping and c.period is defined %}
                  {% set p2 = (c.period | string).replace('–', '-').replace(' ', '') %}
                  {% if '-' in p2 %}
                    {% set hm = p2.split('-')[0].split(':') %}
                    {% if hm | length == 2 %}
                      {% set h = hm[0] | int %}
                      {% set price_kwh = (c.rce_pln | float(0)) / 1000 %}
                      {% if h >= 6 and h < 11 and price_kwh >= full_bat_min_price_preview %}
                        {% set nsMorning.full_cand = nsMorning.full_cand + [{'price_kwh': price_kwh, 'batt_cap': battery_slot_cap_kwh}] %}
                      {% elif h >= 6 and h < 11 and price_kwh >= semi_bat_min_price and price_kwh < full_bat_min_price_preview %}
                        {% set nsMorning.semi_cand = nsMorning.semi_cand + [{'price_kwh': price_kwh, 'batt_cap': battery_slot_cap_kwh}] %}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% for s in nsMorning.full_cand | sort(attribute='price_kwh', reverse=true) %}
                {% if nsMorning.rem_full > 0.001 %}
                  {% set batt_use = [s.batt_cap, nsMorning.rem_full] | min %}
                  {% set nsMorning.rem_full = nsMorning.rem_full - batt_use %}
                  {% set nsMorning.full = nsMorning.full + batt_use %}
                {% endif %}
              {% endfor %}
              {% set nsMorning.rem_semi = max_export_budget_u - nsMorning.full %}
              {% if nsMorning.rem_semi < 0 %}{% set nsMorning.rem_semi = 0 %}{% endif %}
              {% for s in nsMorning.semi_cand | sort(attribute='price_kwh', reverse=true) %}
                {% if nsMorning.rem_semi > 0.001 %}
                  {% set batt_use = [s.batt_cap, nsMorning.rem_semi] | min %}
                  {% set nsMorning.rem_semi = nsMorning.rem_semi - batt_use %}
                  {% set nsMorning.semi = nsMorning.semi + batt_use %}
                {% endif %}
              {% endfor %}
              {% set morning_export_plan_batt_sum = nsMorning.full + nsMorning.semi %}
              {% if morning_export_plan_batt_sum <= 0.01 %}
                {% set morning_export_reason = 'NO_SLOTS' %}
              {% else %}
                {% set morning_export_missing_u = morning_export_plan_batt_sum - current_export_budget_u %}
                {% if morning_export_missing_u < 0 %}{% set morning_export_missing_u = 0 %}{% endif %}
                {% set limit_dzienny = states('sensor.aktualny_limit_dzienny') | float(0) %}
                {% set morning_export_extra_u = [morning_export_missing_u, limit_dzienny] | min %}
                {% set morning_export_extra_u = [morning_export_extra_u, (max_ene_u - E6_after_base)] | min %}
                {% if morning_export_extra_u < 0 %}{% set morning_export_extra_u = 0 %}{% endif %}
                {% if morning_export_extra_u > 0.01 %}
                  {% set grid_add_u = grid_add_u + morning_export_extra_u %}
                  {% if grid_add_u > (max_ene_u - E6_base) %}{% set grid_add_u = (max_ene_u - E6_base) %}{% endif %}
                  {% if grid_add_u < 0 %}{% set grid_add_u = 0 %}{% endif %}
                  {% set E_start_u_new = E6_base + grid_add_u %}
                  {% set rano_cel = (((E_start_u_new + prog_min_kwh) / pojemnosc_kwh) * 100) | int %}
                  {% if rano_cel < 25 %}{% set rano_cel = 25 %}{% endif %}
                  {% if rano_cel > 100 %}{% set rano_cel = 100 %}{% endif %}
                  {% set rano_czy_ladowac = true %}
                  {% set rano_powod = rano_powod ~ '+EXPORT' %}
                  {% set morning_export_reason = 'ADD_EXPORT_TOPUP' %}
                {% else %}
                  {% set morning_export_reason = 'NO_EXTRA_TOPUP' %}
                {% endif %}
              {% endif %}
            {% elif is_state('input_boolean.magazyn_doladowanie_pod_eksport_poranek', 'on') and rano_cel >= 100 %}
              {% set morning_export_reason = 'SKIP_CEL_100' %}
            {% endif %}

            {% set rano_cel_final = rano_cel %}
            {% if E6_base > E6_safe_max %}
              {% set E6_target = [E6_plan_required, E6_safe_max] | max %}
              {% set rano_cel_final = (((E6_target + prog_min_kwh) / pojemnosc_kwh) * 100) | int %}
              {% if rano_cel_final < 25 %}{% set rano_cel_final = 25 %}{% endif %}
              {% if rano_cel_final > 100 %}{% set rano_cel_final = 100 %}{% endif %}
              {% set rano_czy_ladowac = true %}
            {% endif %}

            {% set required_soc = booked_soc %}
            {% if rano_czy_ladowac and (rano_cel_final | int) > (required_soc | int) %}
              {% set required_soc = rano_cel_final | int %}
            {% endif %}
            {% set limit_soc = [required_soc | int, soc_teraz | int] | min %}
  
            {{ mode }}###{{ will_spill }}###{{ spill_start_slot }}###{{ has_good_price_slots }}###{{ good_slot_count }}###{{ partial_bat_min_price|round(3) }}###{{ full_bat_min_price|round(3) }}###{{ survival_energy|round(2) }}###{{ reserve_kwh|round(2) }}###{{ export_energy_needed|round(2) }}###{{ booked_energy|round(2) }}###{{ booked_soc }}###{{ limit_soc }}###{{ good_lines }}###{{ nsSurvive.lines }}###{{ nsSpill.lines }}###{{ soc_min_dynamic_13_tomorrow }}###{{ soc_mid_stop_tomorrow }}###{{ battery_budget_high|round(2) }}###{{ pv_debug }}###{{ rano_cel_final }}###{{ 'ON' if rano_czy_ladowac else 'OFF' }}###{{ rano_powod }}###{{ grid_add_u|round(2) }}###{{ E6_req_floor|round(2) }}###{{ E6_req_floor_rano|round(2) }}###{{ E6_req_target|round(2) }}###{{ E6_req_afternoon|round(2) }}###{{ morning_export_reason }}###{{ morning_export_extra_u|round(2) }}
  
      - variables:
          mode_dbg: "{{ pack.split('###')[0] }}"
          will_spill: "{{ pack.split('###')[1] == 'True' }}"
          spill_start_slot: "{{ pack.split('###')[2] | int(28) }}"
          has_good_price_slots: "{{ pack.split('###')[3] == 'True' }}"
          good_slot_count: "{{ pack.split('###')[4] | int(0) }}"
          partial_bat_min_price_dbg: "{{ pack.split('###')[5] | float(0) }}"
          full_bat_min_price_dbg: "{{ pack.split('###')[6] | float(0) }}"
          survival_energy: "{{ pack.split('###')[7] | float(0) }}"
          reserve_kwh: "{{ pack.split('###')[8] | float(0) }}"
          export_energy_needed: "{{ pack.split('###')[9] | float(0) }}"
          booked_energy: "{{ pack.split('###')[10] | float(0) }}"
          booked_soc: "{{ pack.split('###')[11] | int(20) }}"
          limit_soc: "{{ pack.split('###')[12] | int(20) }}"
          good_lines: "{{ pack.split('###')[13] }}"
          survive_lines: "{{ pack.split('###')[14] }}"
          spill_lines: "{{ pack.split('###')[15] }}"
          soc_min_dynamic_13_tomorrow: "{{ pack.split('###')[16] | int(20) }}"
          soc_mid_stop_tomorrow: "{{ pack.split('###')[17] | int(25) }}"
          battery_budget_high: "{{ pack.split('###')[18] | float(0) }}"
          pv_debug: "{{ pack.split('###')[19] }}"
          rano_preview_soc: "{{ pack.split('###')[20] | int(20) }}"
          rano_preview_charge: "{{ pack.split('###')[21] }}"
          rano_preview_reason: "{{ pack.split('###')[22] }}"
          rano_preview_grid_add: "{{ pack.split('###')[23] | float(0) }}"
          rano_preview_req_floor: "{{ pack.split('###')[24] | float(0) }}"
          rano_preview_req_floor_rano: "{{ pack.split('###')[25] | float(0) }}"
          rano_preview_req_target: "{{ pack.split('###')[26] | float(0) }}"
          rano_preview_req_afternoon: "{{ pack.split('###')[27] | float(0) }}"
          rano_preview_export_reason: "{{ pack.split('###')[28] }}"
          rano_preview_export_extra: "{{ pack.split('###')[29] | float(0) }}"
  
      - service: system_log.write
        data:
          level: warning
          message: >
            NOC_V3_12 {{ noc_booking_hour }}:00
            | soc_now={{ soc_teraz | round(1) }}%
            | delayed_po22={{ 'YES' if export_po22_delayed_booking else 'NO' }}
            | mode={{ mode_dbg }}
            | will_spill={{ 'YES' if will_spill else 'NO' }}
            | spill_start_slot={{ spill_start_slot }}
            | good_slots={{ 'YES' if has_good_price_slots else 'NO' }} count={{ good_slot_count }}
            | partial_bat_min={{ partial_bat_min_price_dbg }}
            | full_bat_min={{ full_bat_min_price_dbg }}
            | survival={{ survival_energy }} reserve={{ reserve_kwh }} export_need={{ export_energy_needed }}
            | battery_budget_high={{ battery_budget_high }}
            | booked_energy={{ booked_energy }} booked_soc={{ booked_soc }} limit_soc={{ limit_soc }}
            | rano_preview={{ rano_preview_soc }}% charge={{ rano_preview_charge }} reason={{ rano_preview_reason }}
            | rano_grid_add={{ rano_preview_grid_add }} req_floor={{ rano_preview_req_floor }}
            | req_floor_rano={{ rano_preview_req_floor_rano }} req_target={{ rano_preview_req_target }}
            | req_afternoon={{ rano_preview_req_afternoon }} export={{ rano_preview_export_reason }} extra={{ rano_preview_export_extra }}
            | min13_tomorrow={{ soc_min_dynamic_13_tomorrow }} mid_stop_tomorrow={{ soc_mid_stop_tomorrow }}
            | {{ pv_debug }}
  
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ soc_teraz <= 20 }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.battery_discharge_to_grid
  
              - delay:
                  seconds: 3
  
              - service: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.pv_discharge_to_grid
  
              - service: script.ems_notify
                data:
                  title: "🌙 NOC v3.12: Brak blokady"
                  message: >
                    Poziom baterii {{ soc_teraz | round(0) }}% jest zbyt niski (<= 20%).
                    Pominięto ustawianie blokady.
  
          - conditions:
              - condition: template
                value_template: "{{ soc_teraz > 20 }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.manual_battery_charge_limit
                data:
                  value: "{{ limit_soc }}"
  
              - delay:
                  seconds: 3
  
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.battery_charge_from_grid
  
              - service: script.ems_notify
                data:
                  title: "🌙 NOC v3.12: Booking magazynu na jutro"
                  message: >
                    Godzina bookingu: {{ noc_booking_hour }}:00
                    Eksport po 22: {{ 'TAK' if export_po22_delayed_booking else 'NIE' }}

                    SOC teraz: {{ soc_teraz | round(0) }}%
                    Ustawiony limit: {{ limit_soc }}%
  
                    Tryb: {{ mode_dbg }}
  
                    Jutro spill: {{ 'TAK' if will_spill else 'NIE' }}
                    Start spillu: {{ '%02d:%02d' | format(spill_start_slot // 2, (spill_start_slot % 2) * 30) if will_spill else 'brak' }}
  
                    Użyteczne sloty cenowe rano: {{ 'TAK' if has_good_price_slots else 'NIE' }}
                    Liczba slotów: {{ good_slot_count }}
                    Próg PARTIAL: {{ partial_bat_min_price_dbg | round(3) }} PLN/kWh
                    Próg FULL: {{ full_bat_min_price_dbg | round(3) }} PLN/kWh
  
                    Energia na przetrwanie: {{ survival_energy | round(2) }} kWh
                    Rezerwa komfortowa: {{ reserve_kwh | round(2) }} kWh
                    Energia na poranny eksport: {{ export_energy_needed | round(2) }} kWh
                    Budżet BAT HIGH z obecnego SOC: {{ battery_budget_high | round(2) }} kWh
                    Razem booked: {{ booked_energy | round(2) }} kWh
                    Booked SOC: {{ booked_soc }}%
                    Preview 02:00: {{ rano_preview_soc }}% / charge {{ rano_preview_charge }} / {{ rano_preview_reason }}
                    Preview grid add: {{ rano_preview_grid_add | round(2) }} kWh
                    Preview req: floor={{ rano_preview_req_floor | round(2) }} kWh,
                    floor_rano={{ rano_preview_req_floor_rano | round(2) }} kWh,
                    target={{ rano_preview_req_target | round(2) }} kWh,
                    afternoon={{ rano_preview_req_afternoon | round(2) }} kWh
                    Preview export: {{ rano_preview_export_reason }} +{{ rano_preview_export_extra | round(2) }} kWh
  
                    Jutrzejszy min SOC do 13:00: {{ soc_min_dynamic_13_tomorrow }}%
                    Min SOC rano (floor): {{ soc_min_rano_pct }}%
                    Jutrzejszy mid stop: {{ soc_mid_stop_tomorrow }}%
  
                    PV debug:
                    {{ pv_debug }}
  
                    Sloty użyteczne cenowo:
                    {{ good_lines if good_lines | length > 0 else '\n- brak' }}
  
                    Przetrwanie do spillu / 13:00:
                    {{ survive_lines if survive_lines | length > 0 else '\n- brak' }}
  
                    Godziny przepełnienia magazynu:
                    {{ spill_lines if spill_lines | length > 0 else '\n- brak' }}

      - service: var.set
        data:
          entity_id: var.magazyn_plan_export_po_22
          value: 0
          attributes:
            last_update: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            enabled: false
            reset_by: "noc_v3_12_booking"
            booking_hour: "{{ noc_booking_hour }}"

  ###############################################################################
  # BILANSOWANIE GODZINOWE — zadanie 2/2 (Asana 1214026027008583)
  #
  # KONTEKST PRAWNY:
  # Prosument w net-billingu rozliczany jest godzinowo: w obrebie jednej godziny
  # zegarowej eksport i import sa netowane 1:1. Jesli import_h > eksport_h,
  # roznica placona po cenie zakupu (koszt_drozsza). Jesli eksport_h >= import_h,
  # caly import jest "zjedzony" po cenie RCE - plus netto sprzedaz.
  #
  # POMYSL:
  # O HH:45 sprawdz realne saldo importu/eksportu w biezacej godzinie i jesli
  # jest deficyt - wlacz rozladowanie baterii przez ostatnie 15 min, aby godzina
  # zamknela sie bilansowo.
  #
  # ZALOZENIA:
  # - Snapshot licznikow robiony o HH:00 przez osobna automatyzacje.
  # - Jeden strzal na godzine (HH:45:30 - 30s po triggerze planera).
  # - NIE wylacza rozladowania (robi to planer w nowej godzinie).
  # - Nie narusza SOC floor: rano var.magazyn_soc_min_rano_percent,
  #   wieczorem var.magazyn_soc_floor_percent.
  # - Jesli snapshot nie zostal odswiezony w biezacej godzinie (restart HA)
  #   - w tej godzinie domykacz nie dziala.
  # - Dziala tylko w godzinach sesji planera: 06-12 i 15-21.
  ###############################################################################

  - id: magazyn_snapshot_licznikow_hh00
    alias: "Magazyn: snapshot licznikow na start godziny"
    mode: single
    description: >
      O kazdej pelnej godzinie zapisuje biezacy stan licznikow importu i eksportu
      z Solarman do dwoch var. Sluzy jako baza do obliczania delty godzinowej
      w domykaczu godziny (zadanie 2/2).
    trigger:
      - platform: time_pattern
        minutes: 0
        seconds: 15
    action:
      - service: var.set
        data:
          entity_id: var.magazyn_import_snapshot_hh00
          value: "{{ states('sensor.solarman_total_energy_bought_safe') | float(0) }}"
      - service: var.set
        data:
          entity_id: var.magazyn_eksport_snapshot_hh00
          value: "{{ states('sensor.solarman_total_energy_sold_safe') | float(0) }}"
      # Reset celu domykacza — nowa godzina, stary target nieaktualny
      - service: var.set
        data:
          entity_id: var.magazyn_domykacz_exp_target
          value: "0"

  - id: magazyn_domykacz_godziny_hh45_v2_0
    alias: "Magazyn: Domykacz godziny (HH:45) v2.0"
    mode: single
    description: >
      Zadanie 2/2: o HH:45:30 sprawdza realne salda importu/eksportu w biezacej
      godzinie i jesli import > eksport - zamyka bilans przez ostatnie 15 min.
      Jesli PV ma nadwyzke pokrywajaca deficyt → wlacza pv_discharge_to_grid (bez BAT).
      Jesli brak nadwyzki PV → wlacza battery_discharge_to_grid jak dotychczas.
      Nie narusza budzetu SOC potrzebnego do dociagniecia do 13:00 (rano) ani
      do 22:00 (wieczorem). Jeden strzal na godzine, niezalezny od planera.
    trigger:
      - platform: time_pattern
        minutes: "45"
        seconds: "30"
    condition:
      - condition: template
        value_template: >
          {{ now().hour in [6,7,8,9,10,11,12, 15,16,17,18,19,20,21] }}
    action:
      - variables:
          h_now: "{{ now().hour }}"
          imp_now: "{{ states('sensor.solarman_total_energy_bought_safe') | float(0) }}"
          exp_now: "{{ states('sensor.solarman_total_energy_sold_safe') | float(0) }}"
          imp_snap: "{{ states('var.magazyn_import_snapshot_hh00') | float(0) }}"
          exp_snap: "{{ states('var.magazyn_eksport_snapshot_hh00') | float(0) }}"
          snap_is_fresh: >
            {{ states.var.magazyn_import_snapshot_hh00 is not none
               and (states.var.magazyn_import_snapshot_hh00.last_changed
                    >= now().replace(minute=0, second=0, microsecond=0)) }}
          soc_now: "{{ states('sensor.solarman_battery_safe') | float(0) }}"
          pojemnosc_kwh: "{{ states('var.magazyn_pojemnosc_brutto_kwh') | float(15) }}"
          max_moc_kw: "{{ states('var.magazyn_max_moc_rozladowania_kw') | float(6) }}"
          soc_floor_pct_eff: >
            {% if (now().hour) < 13 %}
              {{ states('var.magazyn_soc_min_rano_percent') | float(25) }}
            {% else %}
              {{ states('var.magazyn_soc_floor_percent') | float(20) }}
            {% endif %}
          pv_power_5m_w: "{{ states('sensor.srednia_moc_z_pv_5_minut') | float(0) }}"
          house_power_5m_w: "{{ [states('sensor.srednia_moc_pobierana_przez_dom_2_5_minut') | float(0), 0] | max }}"

      - variables:
          imp_h: "{{ [imp_now - imp_snap, 0] | max }}"
          exp_h: "{{ [exp_now - exp_snap, 0] | max }}"
          deficit_raw: "{{ [(imp_now - imp_snap) - (exp_now - exp_snap), 0] | max }}"
          slot_cap_kwh: "{{ (max_moc_kw | float(6)) * 0.25 }}"
          e_available_kwh: >
            {{ [((soc_now - (soc_floor_pct_eff | float(25))) / 100.0)
                * (pojemnosc_kwh | float(15)), 0] | max }}
          pv_surplus_w: "{{ [pv_power_5m_w - house_power_5m_w, 0] | max }}"

      - variables:
          deficit_allowed: "{{ [deficit_raw, slot_cap_kwh, e_available_kwh] | min }}"
          pv_can_close_kwh: "{{ pv_surplus_w * 0.25 / 1000 }}"
          pv_can_close: "{{ pv_can_close_kwh >= deficit_raw and deficit_raw > 0.05 }}"
          skip_reason: >-
            {% if not snap_is_fresh %}snapshot_stale
            {%- elif deficit_raw <= 0.05 %}no_deficit
            {%- elif e_available_kwh <= 0.05 and not pv_can_close %}soc_floor
            {%- else %}OK{%- endif %}
          was_discharging: "{{ is_state('input_boolean.battery_discharge_to_grid', 'on') }}"
          was_pv_discharging: "{{ is_state('input_boolean.pv_discharge_to_grid', 'on') }}"
          action_mode: >-
            {%- if skip_reason != 'OK' %}SKIP
            {%- elif pv_can_close %}PV
            {%- else %}BAT{%- endif %}

      - service: script.ems_notify
        data:
          title: "Domykacz {{ h_now }}:45 | {{ skip_reason }} | {{ action_mode }}"
          message: >-
            imp_h={{ imp_h | round(3) }} kWh
            | exp_h={{ exp_h | round(3) }} kWh
            | deficit_raw={{ deficit_raw | round(3) }} kWh
            | slot_cap={{ slot_cap_kwh | round(3) }} kWh
            | e_avail={{ e_available_kwh | round(3) }} kWh
            | deficit_allowed={{ deficit_allowed | round(3) }} kWh
            | SOC={{ soc_now }}% (floor {{ soc_floor_pct_eff }}%)
            | pv_surplus={{ pv_surplus_w | round(0) }} W ({{ pv_can_close_kwh | round(3) }} kWh/15min)
            | pv_can_close={{ pv_can_close }}
            | action={{ action_mode }}
            | snap_fresh={{ snap_is_fresh }}
            | imp_snap={{ imp_snap | round(3) }} kWh
            | exp_snap={{ exp_snap | round(3) }} kWh
            | was_discharging={{ was_discharging }}
            | was_pv_discharging={{ was_pv_discharging }}

      - condition: template
        value_template: "{{ snap_is_fresh and (deficit_allowed > 0.05 or pv_can_close) }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ pv_can_close }}"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.pv_discharge_to_grid
              # Nie ustawiamy targetu jesli planer juz wlaczyl PV — planer sam zarzadza.
              - condition: template
                value_template: "{{ not was_pv_discharging }}"
              - service: var.set
                data:
                  entity_id: var.magazyn_domykacz_exp_target
                  value: "{{ (exp_snap + deficit_raw) | round(3) }}"
          - conditions:
              - condition: template
                value_template: "{{ deficit_allowed > 0.05 }}"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.battery_discharge_to_grid
              # Nie ustawiamy targetu jesli planer juz wlaczyl discharge — planer sam zarzadza.
              - condition: template
                value_template: "{{ not was_discharging }}"
              - service: var.set
                data:
                  entity_id: var.magazyn_domykacz_exp_target
                  value: "{{ (exp_snap + deficit_allowed) | round(3) }}"

  ###############################################################################
  # STOPPER DOMYKACZA: wyłącz discharge gdy total_energy_sold_safe >= target
  ###############################################################################
  - id: magazyn_stopper_domykacz_exp_target
    alias: "Magazyn: STOP domykacz – eksport >= cel"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.solarman_total_energy_sold_safe
    action:
      - variables:
          exp_now: "{{ states('sensor.solarman_total_energy_sold_safe') | float(0) }}"
          target: "{{ states('var.magazyn_domykacz_exp_target') | float(0) }}"
          discharging: >
            {{ is_state('input_boolean.battery_discharge_to_grid', 'on')
               or is_state('input_boolean.pv_discharge_to_grid', 'on') }}
      - condition: template
        value_template: "{{ target > 0 and discharging and exp_now >= target }}"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.battery_discharge_to_grid
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.pv_discharge_to_grid
      - service: var.set
        data:
          entity_id: var.magazyn_domykacz_exp_target
          value: "0"
      - service: script.ems_notify
        data:
          title: "Domykacz STOP: cel osiągnięty"
          message: >-
            exp_now={{ exp_now | round(3) }} kWh >= target={{ target | round(3) }} kWh
            → battery_discharge_to_grid + pv_discharge_to_grid OFF
