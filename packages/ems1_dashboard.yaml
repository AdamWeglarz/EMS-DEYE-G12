###############################################################################
# EMS1 — dashboard diagnostics
###############################################################################

template:
  - sensor:
      - name: "EMS1: akcja"
        unique_id: ems1_action
        icon: mdi:home-lightning-bolt-outline
        state: >
          {% if is_state('input_boolean.battery_charge_from_grid', 'on') %}
            charge
          {% elif is_state('input_boolean.battery_discharge_to_grid', 'on') %}
            discharge
          {% elif is_state('input_boolean.pv_discharge_to_grid', 'on') %}
            pv_export
          {% else %}
            idle
          {% endif %}

      - name: "EMS1: tryb działania"
        unique_id: ems1_tryb_dzialania
        icon: mdi:cog
        state: >
          {% if is_state('input_boolean.battery_charge_from_grid', 'on') %}
            Ładowanie z sieci
          {% elif is_state('input_boolean.battery_discharge_to_grid', 'on') %}
            Eksport BAT+PV
          {% elif is_state('input_boolean.pv_discharge_to_grid', 'on') %}
            Eksport PV
          {% else %}
            Praca normalna
          {% endif %}

      - name: "EMS1: bilans dzienny"
        unique_id: ems1_daily_balance_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:scale-balance
        state: >
          {{ (
            states('sensor.solarman_microinverter_energy_today_safe') | float(0)
            + states('sensor.solarman_daily_energy_bought_safe') | float(0)
            + states('sensor.solarman_daily_battery_discharge') | float(0)
            - states('sensor.solarman_daily_energy_sold_safe') | float(0)
            - states('sensor.solarman_daily_battery_charge') | float(0)
            - states('sensor.solarman_today_load_consumption') | float(0)
            - states('sensor.solarman_today_losses') | float(0)
          ) | round(4) }}

      - name: "EMS1: dzis PV"
        unique_id: ems1_daily_pv_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:solar-power-variant
        state: >
          {{ states('sensor.solarman_microinverter_energy_today_safe') | float(0) | round(2) }}

      - name: "EMS1: dzis load"
        unique_id: ems1_daily_load_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:home-lightning-bolt
        state: >
          {{ states('sensor.solarman_today_load_consumption') | float(0) | round(2) }}

      - name: "EMS1: dzis grid import"
        unique_id: ems1_daily_grid_import_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:transmission-tower-import
        state: >
          {{ states('sensor.solarman_daily_energy_bought_safe') | float(0) | round(2) }}

      - name: "EMS1: dzis grid eksport"
        unique_id: ems1_daily_grid_export_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:transmission-tower-export
        state: >
          {{ states('sensor.solarman_daily_energy_sold_safe') | float(0) | round(2) }}

      - name: "EMS1: dzis magazyn ladowanie"
        unique_id: ems1_daily_battery_charge_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:battery-arrow-down-outline
        state: >
          {{ states('sensor.solarman_daily_battery_charge') | float(0) | round(2) }}

      - name: "EMS1: dzis magazyn rozladowanie"
        unique_id: ems1_daily_battery_discharge_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:battery-arrow-up-outline
        state: >
          {{ states('sensor.solarman_daily_battery_discharge') | float(0) | round(2) }}

      - name: "EMS1: dzis magazyn netto"
        unique_id: ems1_daily_battery_net_kwh
        unit_of_measurement: "kWh"
        state_class: measurement
        icon: mdi:battery-sync
        state: >
          {{ (
            states('sensor.ems1_dzis_magazyn_ladowanie') | float(0)
            - states('sensor.ems1_dzis_magazyn_rozladowanie') | float(0)
          ) | round(2) }}

      - name: "EMS1: dzis energia pokryta bez importu"
        unique_id: ems1_daily_saved_energy_kwh
        unit_of_measurement: "kWh"
        state_class: measurement
        icon: mdi:leaf-circle-outline
        state: >
          {% set load = states('sensor.ems1_dzis_load') | float(0) %}
          {% set grid_import = states('sensor.ems1_dzis_grid_import') | float(0) %}
          {{ [load - grid_import, 0] | max | round(2) }}

      - name: "EMS1: dzis oszczednosc G12"
        unique_id: ems1_daily_savings_g12_pln
        unit_of_measurement: "PLN"
        device_class: monetary
        state_class: measurement
        icon: mdi:piggy-bank-outline
        state: >
          {{ states('sensor.finanse_oszczednosc_vs_g12_dzis') | float(0) | round(2) }}

      - name: "EMS1: dzis oszczednosc G11"
        unique_id: ems1_daily_savings_g11_pln
        unit_of_measurement: "PLN"
        device_class: monetary
        state_class: measurement
        icon: mdi:piggy-bank
        state: >
          {{ states('sensor.finanse_oszczednosc_vs_g11_dzis') | float(0) | round(2) }}

      - name: "EMS1: dzis koszt netto"
        unique_id: ems1_daily_net_cost_pln
        unit_of_measurement: "PLN"
        device_class: monetary
        state_class: measurement
        icon: mdi:cash
        state: >
          {{ states('sensor.finanse_koszt_netto_dzis') | float(0) | round(2) }}

      - name: "EMS1: bilans dzienny opis"
        unique_id: ems1_daily_balance_summary
        icon: mdi:clipboard-list-outline
        state: >
          PV {{ states('sensor.ems1_dzis_pv') }} kWh |
          Load {{ states('sensor.ems1_dzis_load') }} kWh |
          Grid {{ states('sensor.ems1_dzis_grid_import') }}/{{ states('sensor.ems1_dzis_grid_eksport') }} kWh |
          BAT {{ states('sensor.ems1_dzis_magazyn_ladowanie') }}/{{ states('sensor.ems1_dzis_magazyn_rozladowanie') }} kWh

      - name: "EMS1: PV aktualne"
        unique_id: ems1_pv_actual_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        state: >
          {{ (states('sensor.solarman_microinverter_power_safe') | float(0) / 1000) | round(3) }}

      - name: "EMS1: PV prognoza teraz"
        unique_id: ems1_pv_forecast_now_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:solar-power-variant-outline
        state: >
          {{ (states('sensor.solcast_pv_forecast_moc_w_30_minut') | float(0) / 1000) | round(3) }}

      - name: "EMS1: blad prognozy PV"
        unique_id: ems1_pv_forecast_error_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:delta
        state: >
          {{ (
            states('sensor.ems1_pv_aktualne') | float(0)
            - states('sensor.ems1_pv_prognoza_teraz') | float(0)
          ) | round(3) }}

      - name: "EMS1: blad prognozy PV procent"
        unique_id: ems1_pv_forecast_error_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:percent-outline
        state: >
          {% set forecast = states('sensor.ems1_pv_prognoza_teraz') | float(0) %}
          {% if forecast <= 0 %}
            0
          {% else %}
            {{ ((states('sensor.ems1_blad_prognozy_pv') | float(0)) / forecast * 100) | round(1) }}
          {% endif %}

      - name: "EMS1: dom aktualnie"
        unique_id: ems1_home_actual_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:home-lightning-bolt
        state: >
          {{ (states('sensor.moc_pobierana_przez_dom_safe') | float(0) / 1000) | round(3) }}

      - name: "EMS1: dom prognoza teraz"
        unique_id: ems1_home_forecast_now_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:home-analytics
        state: >
          {{ (states('sensor.srednia_moc_pobierana_przez_dom_2_5_minut') | float(0) / 1000) | round(3) }}

      - name: "EMS1: blad prognozy domu"
        unique_id: ems1_home_forecast_error_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:delta
        state: >
          {{ (
            states('sensor.ems1_dom_aktualnie') | float(0)
            - states('sensor.ems1_dom_prognoza_teraz') | float(0)
          ) | round(3) }}

      - name: "EMS1: blad prognozy domu procent"
        unique_id: ems1_home_forecast_error_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:percent-outline
        state: >
          {% set forecast = states('sensor.ems1_dom_prognoza_teraz') | float(0) %}
          {% if forecast <= 0 %}
            0
          {% else %}
            {{ ((states('sensor.ems1_blad_prognozy_domu') | float(0)) / forecast * 100) | round(1) }}
          {% endif %}

      - name: "EMS1: PV prognoza dzis"
        unique_id: ems1_pv_forecast_today_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:solar-power-variant
        state: >
          {{ states('sensor.solcast_pv_forecast_prognoza_na_dzisiaj') | float(0) | round(2) }}

      - name: "EMS1: PV prognoza pozostala"
        unique_id: ems1_pv_forecast_remaining_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:weather-sunset-down
        state: >
          {{ states('sensor.solcast_pv_forecast_pozostala_prognoza_na_dzis') | float(0) | round(2) }}

      - name: "EMS1: podsumowanie"
        unique_id: ems1_summary
        icon: mdi:clipboard-text-outline
        state: >
          {{ states('sensor.ems1_akcja') }} |
          PV err={{ states('sensor.ems1_blad_prognozy_pv') }} kW,
          dom err={{ states('sensor.ems1_blad_prognozy_domu') }} kW
