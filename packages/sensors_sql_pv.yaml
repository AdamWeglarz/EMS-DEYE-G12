###############################################################################
# SQL SENSORY – zarządzanie PV / magazynem
# Oddzielny plik – configuration.yaml zawiera hasła do bazy danych
###############################################################################

sql:
  - name: "Oddana energia biezacy slot 15min"
    unique_id: "sql_energy_sold_current_slot_15min"
    query: >
      SELECT COALESCE(ROUND(MAX(st.sum) - MIN(st.sum), 4), 0) AS value
      FROM statistics_short_term st
      JOIN statistics_meta sm ON st.metadata_id = sm.id
      WHERE sm.statistic_id = 'sensor.solarman_total_energy_sold_safe'
        AND st.start_ts >= FLOOR((UNIX_TIMESTAMP(NOW()) - 5) / 900) * 900
        AND st.start_ts <  FLOOR((UNIX_TIMESTAMP(NOW()) - 5) / 900) * 900 + 900;
    column: "value"
    unit_of_measurement: "kWh"

  - name: "Oddana energia dzis 6-13"
    unique_id: "sql_energy_sold_today_0613"
    query: >
      SELECT ROUND(MAX(st.sum) - MIN(st.sum), 4) AS value
      FROM statistics_short_term st
      JOIN statistics_meta sm ON st.metadata_id = sm.id
      WHERE sm.statistic_id = 'sensor.solarman_total_energy_sold_safe'
        AND st.start_ts >= UNIX_TIMESTAMP(CONCAT(DATE(NOW()), ' 06:00:00'))
        AND st.start_ts <  UNIX_TIMESTAMP(CONCAT(DATE(NOW()), ' 13:00:00'));
    column: "value"
    unit_of_measurement: "kWh"

  - name: "Oddana energia dzis 15-22"
    unique_id: "sql_energy_sold_today_1522"
    query: >
      SELECT ROUND(MAX(st.sum) - MIN(st.sum), 4) AS value
      FROM statistics_short_term st
      JOIN statistics_meta sm ON st.metadata_id = sm.id
      WHERE sm.statistic_id = 'sensor.solarman_total_energy_sold_safe'
        AND st.start_ts >= UNIX_TIMESTAMP(CONCAT(DATE(NOW()), ' 15:00:00'))
        AND st.start_ts <  UNIX_TIMESTAMP(CONCAT(DATE(NOW()), ' 22:00:00'));
    column: "value"
    unit_of_measurement: "kWh"

  - name: "Srednie zuzycie o obecnej godzinie"
    unique_id: "sql_avg_usage_current_hour"
    query: >
      SELECT AVG(corrected_diff) AS value
      FROM (
        SELECT
          CASE
            WHEN diff < 0 OR diff > 20 THEN default_kwh
            ELSE diff
          END AS corrected_diff
        FROM (
          SELECT
            (MAX(CAST(s.state AS DECIMAL(10,3))) - MIN(CAST(s.state AS DECIMAL(10,3)))) AS diff,
            (
              SELECT CAST(v.state AS DECIMAL(10,3))
              FROM states v
              JOIN states_meta vm ON v.metadata_id = vm.metadata_id
              WHERE vm.entity_id = 'var.magazyn_konsumpcja_default_kwh_h'
                AND v.state NOT IN ('unknown', 'unavailable', '')
              ORDER BY v.last_updated_ts DESC
              LIMIT 1
            ) AS default_kwh
          FROM states s
          JOIN states_meta m ON s.metadata_id = m.metadata_id
          WHERE m.entity_id = 'sensor.solarman_total_load_consumption'
            AND s.state NOT IN ('unknown', 'unavailable', '')
            AND HOUR(FROM_UNIXTIME(s.last_updated_ts)) = HOUR(NOW())
            AND DATE(FROM_UNIXTIME(s.last_updated_ts)) < CURDATE()
            AND s.last_updated_ts > (UNIX_TIMESTAMP(NOW()) - 2592000)
          GROUP BY DATE(FROM_UNIXTIME(s.last_updated_ts))
        ) AS daily
      ) AS subquery;
    column: "value"
    unit_of_measurement: "kWh"

  - name: "Srednie zuzycie w obecnym slocie 30min"
    unique_id: "sql_avg_usage_current_slot_30min"
    query: >
      SELECT ROUND(AVG(corrected_diff), 6) AS value
      FROM (
        SELECT
          CASE
            WHEN diff IS NULL OR diff < 0 OR diff > 10 THEN default_kwh
            ELSE diff
          END AS corrected_diff
        FROM (
          SELECT
            d.local_date,
            (
              SELECT CAST(s_end.state AS DECIMAL(10,3))
              FROM states s_end
              JOIN states_meta m_end ON s_end.metadata_id = m_end.metadata_id
              WHERE m_end.entity_id = 'sensor.solarman_total_load_consumption_safe'
                AND s_end.state NOT IN ('unknown', 'unavailable', '')
                AND s_end.last_updated_ts <= UNIX_TIMESTAMP(
                  DATE_ADD(
                    CONCAT(d.local_date, ' 00:00:00'),
                    INTERVAL (HOUR(NOW()) * 3600 + FLOOR(MINUTE(NOW()) / 30) * 1800 + 1800) SECOND
                  )
                )
              ORDER BY s_end.last_updated_ts DESC
              LIMIT 1
            ) - (
              SELECT CAST(s_start.state AS DECIMAL(10,3))
              FROM states s_start
              JOIN states_meta m_start ON s_start.metadata_id = m_start.metadata_id
              WHERE m_start.entity_id = 'sensor.solarman_total_load_consumption_safe'
                AND s_start.state NOT IN ('unknown', 'unavailable', '')
                AND s_start.last_updated_ts <= UNIX_TIMESTAMP(
                  DATE_ADD(
                    CONCAT(d.local_date, ' 00:00:00'),
                    INTERVAL (HOUR(NOW()) * 3600 + FLOOR(MINUTE(NOW()) / 30) * 1800) SECOND
                  )
                )
              ORDER BY s_start.last_updated_ts DESC
              LIMIT 1
            ) AS diff,
            (
              SELECT CAST(v.state AS DECIMAL(10,3)) / 2
              FROM states v
              JOIN states_meta vm ON v.metadata_id = vm.metadata_id
              WHERE vm.entity_id = 'var.magazyn_konsumpcja_default_kwh_h'
                AND v.state NOT IN ('unknown', 'unavailable', '')
              ORDER BY v.last_updated_ts DESC
              LIMIT 1
            ) AS default_kwh
          FROM (
            SELECT DISTINCT DATE(FROM_UNIXTIME(s.last_updated_ts)) AS local_date
            FROM states s
            JOIN states_meta m ON s.metadata_id = m.metadata_id
            WHERE m.entity_id = 'sensor.solarman_total_load_consumption_safe'
              AND s.state NOT IN ('unknown', 'unavailable', '')
              AND DATE(FROM_UNIXTIME(s.last_updated_ts)) < CURDATE()
              AND s.last_updated_ts > (UNIX_TIMESTAMP(NOW()) - 2592000)
          ) AS d
        ) AS daily
      ) AS subquery;
    column: "value"
    unit_of_measurement: "kWh"

  - name: "Maks moc PV dzis SQL"
    unique_id: "sql_pv_max_power_today"
    query: >
      SELECT ROUND(MAX(CAST(s.state AS DECIMAL(10,1))), 1) AS value
      FROM states s
      JOIN states_meta m ON s.metadata_id = m.metadata_id
      WHERE m.entity_id = 'sensor.solaredge_ac_power'
        AND s.state NOT IN ('unknown', 'unavailable', '')
        AND s.last_updated_ts >= UNIX_TIMESTAMP(CURDATE());
    column: "value"
    unit_of_measurement: "W"
    device_class: power

template:
  - sensor:
      - name: "Srednie zuzycie godzinne bez urlopu bez sprzatania"
        unique_id: "avg_usage_current_hour_normal"
        unit_of_measurement: "kWh"
        state: >
          {{ states('sensor.srednie_zuzycie_o_obecnej_godzinie') | float(states('var.magazyn_konsumpcja_default_kwh_h') | float(1.5)) | round(3) }}

      - name: "Srednie zuzycie godzinne z urlopem"
        unique_id: "avg_usage_current_hour_vacation"
        unit_of_measurement: "kWh"
        state: >
          {{ states('var.magazyn_konsumpcja_urlop_kwh_h') | float(0.5) | round(3) }}

      - name: "Srednie zuzycie godzinne ze sprzataniem"
        unique_id: "avg_usage_current_hour_cleaning"
        unit_of_measurement: "kWh"
        state: >
          {% set normal = states('sensor.srednie_zuzycie_godzinne_bez_urlopu_bez_sprzatania') | float(states('var.magazyn_konsumpcja_default_kwh_h') | float(1.5)) %}
          {% set mult = states('var.magazyn_konsumpcja_mult_sprzatanie') | float(2.0) %}
          {{ (normal * mult) | round(3) }}

  - trigger:
      - platform: state
        entity_id: sensor.solaredge_ac_power
      - platform: time
        at: "00:00:00"
    sensor:
      - name: "Maks moc PV dzis"
        unique_id: "pv_max_power_today"
        state: >
          {% if trigger.platform == 'time' %}
            0
          {% elif states('sensor.solaredge_ac_power') | float(0) > this.state | float(0) %}
            {{ states('sensor.solaredge_ac_power') | float(0) }}
          {% else %}
            {{ this.state | float(0) }}
          {% endif %}
        unit_of_measurement: "W"
        device_class: power
